<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draw — Digital Divination</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gold:         #c9a84c;
  --gold-light:   #e8c96a;
  --gold-dark:    #7a5c18;
  --void:         #05050d;
  --surface:      #0e0e20;
  --surface2:     #13132e;
  --border:       #1e1e3a;
  --border-gold:  rgba(201,168,76,0.15);
  --text:         #ede5d0;
  --text-mid:     #a89880;
  --text-dim:     #605848;
  --fire:         #c94a2a;
  --earth:        #6a8a3a;
  --water:        #3a6a9a;
  --air:          #8a8a9a;
  --sage:         #7a9e6a;
}

html { scroll-behavior: smooth; }

body {
  background: var(--void);
  background-image:
    radial-gradient(ellipse 70% 50% at 50% 0%, #120828 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 50% 100%, #081420 0%, transparent 60%);
  font-family: 'Cormorant Garamond', Georgia, serif;
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
}

nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 52px;
  background: rgba(5,5,13,0.9);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border-gold);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  z-index: 200;
}

.nav-brand {
  font-family: 'Cinzel Decorative', serif;
  font-size: 12px;
  color: var(--gold);
  letter-spacing: 1px;
}

.nav-links {
  display: flex;
  gap: 16px;
}

.nav-links a {
  font-family: 'Cinzel', serif;
  font-size: 8px;
  letter-spacing: 2px;
  color: var(--text-dim);
  text-decoration: none;
  text-transform: uppercase;
  transition: color 0.2s;
}

.nav-links a:hover { color: var(--gold); }

.table-container {
  padding: 100px 24px 40px;
  max-width: 1100px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
}

.table-header {
  text-align: center;
  margin-bottom: 32px;
}

.table-header h1 {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(24px, 4vw, 40px);
  color: var(--gold-light);
}

.table-subtitle {
  font-style: italic;
  color: var(--text-mid);
  margin-top: 8px;
  font-size: 16px;
}

/* Sky badge */
.sky-badge {
  text-align: center;
  margin-bottom: 20px;
  font-family: 'Cinzel', serif;
  font-size: 0.6rem;
  letter-spacing: 0.12em;
  color: var(--text-dim);
  min-height: 1.5rem;
}
.sky-badge .period-dot {
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  margin-right: 6px;
  vertical-align: middle;
}
.sky-badge .period-dot.sun { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.sky-badge .period-dot.moon { background: var(--water); box-shadow: 0 0 8px var(--water); }

.question-area {
  text-align: center;
  margin-bottom: 24px;
}

.question-input {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  font-style: italic;
  padding: 14px 20px;
  width: 100%;
  max-width: 500px;
  text-align: center;
  transition: border-color 0.3s;
}

.question-input:focus {
  outline: none;
  border-color: var(--gold);
}

.question-input::placeholder {
  color: var(--text-dim);
  opacity: 0.5;
}

/* Sign selector */
.sign-selector {
  text-align: center;
  margin-bottom: 20px;
}

.sign-selector select {
  font-family: 'Cinzel', serif;
  font-size: 0.6rem;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  max-width: 260px;
  width: 100%;
}

.sign-selector select:focus {
  border-color: var(--gold);
  outline: none;
}

.sign-selector label {
  font-family: 'Cinzel', serif;
  font-size: 0.5rem;
  letter-spacing: 0.15em;
  color: var(--text-dim);
  display: block;
  margin-bottom: 6px;
}

.spread {
  display: flex;
  gap: 24px;
  justify-content: center;
  align-items: flex-start;
  flex-wrap: wrap;
  margin-bottom: 48px;
  min-height: 420px;
}

.card-slot {
  flex: 1;
  min-width: 200px;
  max-width: 300px;
  perspective: 1000px;
}

.card-inner {
  position: relative;
  width: 100%;
  aspect-ratio: 2/3;
  transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  transform-style: preserve-3d;
}

.card-inner.flipped {
  transform: rotateY(180deg);
}

.card-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid var(--border);
}

.card-back {
  background: var(--surface2);
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border-gold);
  cursor: default;
}

.card-back-design {
  text-align: center;
}

.card-back-sigil {
  font-size: 48px;
  opacity: 0.6;
}

.card-back-text {
  font-family: 'Cinzel', serif;
  font-size: 7px;
  letter-spacing: 4px;
  color: var(--gold);
  text-transform: uppercase;
  margin-top: 8px;
  opacity: 0.5;
}

.card-front {
  background: var(--surface);
  transform: rotateY(180deg);
  display: flex;
  flex-direction: column;
}

.card-front img {
  width: 100%;
  height: 60%;
  object-fit: cover;
  border-bottom: 1px solid var(--border-gold);
  background: var(--surface2);
}

.card-front .card-info {
  padding: 14px 16px;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.card-position {
  font-family: 'Cinzel', serif;
  font-size: 7px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--gold);
  opacity: 0.6;
  margin-bottom: 4px;
}

.card-name {
  font-family: 'Cinzel Decorative', serif;
  font-size: 14px;
  color: var(--gold-light);
  line-height: 1.2;
}

.card-domain {
  font-family: 'Cinzel', serif;
  font-size: 8px;
  letter-spacing: 2px;
  color: var(--text-dim);
  text-transform: uppercase;
  margin-top: 4px;
}

.card-overlay {
  font-size: 11px;
  font-style: italic;
  color: var(--text-mid);
  margin-top: 6px;
  line-height: 1.4;
}

.reading-area {
  max-width: 700px;
  margin: 0 auto 60px;
  padding: 32px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  display: none;
}

.reading-area.visible {
  display: block;
  animation: fadeUp 0.6s ease;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.reading-header {
  font-family: 'Cinzel Decorative', serif;
  font-size: 18px;
  color: var(--gold-light);
  text-align: center;
  margin-bottom: 24px;
}

.reading-block {
  margin-bottom: 20px;
  padding-left: 16px;
  border-left: 2px solid var(--border-gold);
}

.reading-position {
  font-family: 'Cinzel', serif;
  font-size: 9px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 6px;
}

.reading-text {
  font-size: 15px;
  font-style: italic;
  color: var(--text-mid);
  line-height: 1.7;
}

.reading-synthesis {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--border-gold);
  font-size: 16px;
  font-style: italic;
  color: var(--text);
  line-height: 1.8;
  text-align: center;
}

.button-row {
  text-align: center;
  margin-bottom: 40px;
}

.btn-reveal {
  font-family: 'Cinzel', serif;
  font-size: 12px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--void);
  background: linear-gradient(135deg, var(--gold), var(--gold-light));
  border: none;
  padding: 14px 40px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 0 30px rgba(201,168,76,0.2);
}

.btn-reveal:hover {
  box-shadow: 0 0 50px rgba(201,168,76,0.4);
  transform: translateY(-2px);
}

.btn-reveal:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  transform: none;
}

.btn-new {
  font-family: 'Cinzel', serif;
  font-size: 9px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--text-dim);
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 24px;
  cursor: pointer;
  transition: all 0.2s;
  margin-left: 12px;
}

.btn-new:hover {
  border-color: var(--gold);
  color: var(--gold);
}

.element-fire { color: var(--fire); }
.element-earth { color: var(--earth); }
.element-water { color: var(--water); }
.element-air { color: var(--air); }

.img-placeholder {
  width: 100%;
  height: 60%;
  background: var(--surface2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  opacity: 0.3;
  border-bottom: 1px solid var(--border-gold);
}

/* ── DECK SELECTOR ── */
.deck-selector {
  text-align: center;
  margin-bottom: 24px;
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

.deck-option {
  font-family: 'Cinzel', serif;
  font-size: 8px;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 8px 16px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}

.deck-option:hover {
  border-color: var(--border-gold);
  color: var(--text-mid);
}

.deck-option.active {
  border-color: var(--gold);
  color: var(--gold);
  background: rgba(201,168,76,0.08);
}

.deck-option.suit-fire.active { border-color: var(--fire); color: var(--fire); background: rgba(201,74,42,0.08); }
.deck-option.suit-water.active { border-color: var(--water); color: var(--water); background: rgba(58,106,154,0.08); }
.deck-option.suit-earth.active { border-color: var(--earth); color: var(--earth); background: rgba(106,138,58,0.08); }
.deck-option.suit-air.active { border-color: var(--air); color: var(--air); background: rgba(138,138,154,0.08); }

.deck-divider {
  width: 1px;
  background: var(--border);
  margin: 0 4px;
}

/* Memory stats */
.memory-stats {
  text-align: center;
  margin-top: 20px;
  font-family: 'Cinzel', serif;
  font-size: 0.5rem;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  opacity: 0.5;
}

@media (max-width: 720px) {
  .spread {
    flex-direction: column;
    align-items: center;
  }
  .card-slot {
    max-width: 220px;
  }
  .deck-divider {
    display: none;
  }
}
</style>
</head>
<body>

<nav>
  <div class="nav-brand">Digital Divination</div>
  <div class="nav-links">
    <a href="index.html">← Temple</a>
    <a href="daily.html">Dashboard</a>
    <a href="zodiac.html">Zodiac</a>
    <a href="archive.html">Archive</a>
  </div>
</nav>

<div class="table-container">

  <div class="table-header">
    <h1>🜏 Draw Three Cards</h1>
    <div class="table-subtitle">Past · Present · Future</div>
  </div>

  <!-- Sky badge -->
  <div class="sky-badge" id="skyBadge"></div>

  <!-- Birth sign -->
  <div class="sign-selector">
    <label>Your Sign</label>
    <select id="birthSign">
      <option value="">— Select your sign —</option>
    </select>
  </div>

  <!-- Question -->
  <div class="question-area">
    <input type="text" class="question-input" id="questionInput" 
           placeholder="What question do you bring to the cards?"
           maxlength="200">
  </div>

  <!-- Deck selector -->
  <div class="deck-selector">
    <button class="deck-option active" data-deck="major" onclick="App.setMode('major')">Major Arcana</button>
    <span class="deck-divider"></span>
    <button class="deck-option suit-fire" data-deck="fire" onclick="App.setMode('fire')">🔥 Fire</button>
    <button class="deck-option suit-water" data-deck="water" onclick="App.setMode('water')">🌊 Water</button>
    <button class="deck-option suit-earth" data-deck="earth" onclick="App.setMode('earth')">🜃 Earth</button>
    <button class="deck-option suit-air" data-deck="air" onclick="App.setMode('air')">💨 Air</button>
    <span class="deck-divider"></span>
    <button class="deck-option" data-deck="full" onclick="App.setMode('full')">Full Deck</button>
  </div>

  <!-- Buttons -->
  <div class="button-row">
    <button class="btn-reveal" id="revealBtn" onclick="App.reveal()">▸ Reveal</button>
    <button class="btn-new" onclick="App.reset()">New Reading</button>
  </div>

  <!-- Card spread -->
  <div class="spread" id="spread">
    <div class="card-slot" id="slotPast">
      <div class="card-inner" id="cardPast">
        <div class="card-face card-back">
          <div class="card-back-design">
            <div class="card-back-sigil">🜏</div>
            <div class="card-back-text">Past</div>
          </div>
        </div>
        <div class="card-face card-front" id="frontPast"></div>
      </div>
    </div>

    <div class="card-slot" id="slotPresent">
      <div class="card-inner" id="cardPresent">
        <div class="card-face card-back">
          <div class="card-back-design">
            <div class="card-back-sigil">🜏</div>
            <div class="card-back-text">Present</div>
          </div>
        </div>
        <div class="card-face card-front" id="frontPresent"></div>
      </div>
    </div>

    <div class="card-slot" id="slotFuture">
      <div class="card-inner" id="cardFuture">
        <div class="card-face card-back">
          <div class="card-back-design">
            <div class="card-back-sigil">🜏</div>
            <div class="card-back-text">Future</div>
          </div>
        </div>
        <div class="card-face card-front" id="frontFuture"></div>
      </div>
    </div>
  </div>

  <!-- Reading -->
  <div class="reading-area" id="readingArea"></div>

  <!-- Memory stats -->
  <div class="memory-stats" id="memoryStats"></div>

</div>

<!-- Tetrad scripts -->
<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.8/astronomy.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.min.js"></script>
<script src="js/observe.js"></script>
<script src="js/weight.js"></script>
<script src="divine.js"></script>
<script src="js/deal.js"></script>

<!-- App controller -->
<script>
const App = (() => {
  let mode = 'major';
  let currentDraw = null;

  const SIGNS = ['Aries','Taurus','Gemini','Cancer','Leo','Virgo','Libra','Scorpio','Sagittarius','Capricorn','Aquarius','Pisces'];
  const SIGN_GLYPHS = {'Aries':'♈','Taurus':'♉','Gemini':'♊','Cancer':'♋','Leo':'♌','Virgo':'♍','Libra':'♎','Scorpio':'♏','Sagittarius':'♐','Capricorn':'♑','Aquarius':'♒','Pisces':'♓'};

  // ─── INIT ──────────────────────────────
  async function init() {
    // Populate birth sign dropdown
    const sel = document.getElementById('birthSign');
    SIGNS.forEach(sign => {
      const o = document.createElement('option');
      o.value = sign;
      o.textContent = `${SIGN_GLYPHS[sign]} ${sign}`;
      sel.appendChild(o);
    });

    // Show sky badge
    updateSkyBadge();

    // Show memory stats
    updateMemoryStats();

    // Preload decks
    try {
      await Divine.loadDecks();
    } catch(e) {
      console.warn('Deck preload failed:', e.message);
    }
  }

  // ─── SKY BADGE ─────────────────────────
  function updateSkyBadge() {
    const badge = document.getElementById('skyBadge');
    try {
      const period = Observe.getCurrentPeriod();
      const moonAspect = Observe.getMoonAspect();
      const dotClass = period === 'SUN' ? 'sun' : 'moon';
      const periodLabel = period === 'SUN' ? 'Solar Reading' : 'Lunar Reading';
      badge.innerHTML = `<span class="period-dot ${dotClass}"></span> ${periodLabel} · Moon aspect: ${moonAspect}`;
    } catch(e) {
      badge.innerHTML = 'Sky unavailable · offline reading';
    }
  }

  // ─── MEMORY STATS ──────────────────────
  function updateMemoryStats() {
    const stats = Deal.getStats();
    const el = document.getElementById('memoryStats');
    if (!stats) {
      el.textContent = 'No readings yet. Be the first.';
      return;
    }
    el.textContent = `${stats.totalReadings} readings in memory · ${stats.solarReadings} solar · ${stats.lunarReadings} lunar`;
  }

  // ─── SET MODE ──────────────────────────
  function setMode(newMode) {
    mode = newMode;
    document.querySelectorAll('.deck-option').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.deck === mode);
    });
    reset();
  }

  // ─── REVEAL ────────────────────────────
  async function reveal() {
    const btn = document.getElementById('revealBtn');
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Shuffling...';

    try {
      await Divine.loadDecks();

      const question = document.getElementById('questionInput').value.trim() || null;
      const birthSign = document.getElementById('birthSign').value || null;

      // Draw past + present (uniform random from selected mode)
      const pool = mode === 'major' ? Divine.getMajorDeck() :
                   ['fire','water','earth','air'].includes(mode) ? Divine.getMinorDeck().filter(c => c.element && c.element.toLowerCase() === mode) :
                   Divine.getFullDeck();

      if (pool.length === 0) throw new Error('No cards in selected deck');

      const [past, present] = Divine.uniformDraw(pool, 2);

      // If deal.js is available, use weighted draw for future
      let future;
      try {
        const skyState = await Observe.getSkyState();
        skyState.moonAspect = Observe.getMoonAspect();
        const allCards = Divine.getFullDeck();
        const weights = Weight.calculate(skyState, past, present, allCards);
        const futureDraw = Divine.weightedDraw(allCards, 1, weights);
        future = futureDraw[0];
      } catch(e) {
        // Fallback: uniform random future
        console.warn('Weighted draw failed, using uniform:', e.message);
        const futurePool = pool.filter(c => c.id !== past.id && c.id !== present.id);
        future = Divine.uniformDraw(futurePool.length > 0 ? futurePool : pool, 1)[0];
      }

      // Store draw
      currentDraw = { past, present, future };

      // Render card fronts
      document.getElementById('frontPast').innerHTML = Divine.renderCard(past, 'past');
      document.getElementById('frontPresent').innerHTML = Divine.renderCard(present, 'present');
      document.getElementById('frontFuture').innerHTML = Divine.renderCard(future, 'future');

      // Flip cards with stagger
      const cardPast = document.getElementById('cardPast');
      const cardPresent = document.getElementById('cardPresent');
      const cardFuture = document.getElementById('cardFuture');

      cardPast.classList.remove('flipped');
      cardPresent.classList.remove('flipped');
      cardFuture.classList.remove('flipped');

      void cardPast.offsetWidth;

      setTimeout(() => cardPast.classList.add('flipped'), 100);
      setTimeout(() => cardPresent.classList.add('flipped'), 400);
      setTimeout(() => cardFuture.classList.add('flipped'), 700);

      // Build reading
      setTimeout(() => {
        const reading = {
          cards: { past, present, future },
          question: question || 'The unspoken question',
          skyContext: {}
        };

        // Try to add sky context
        try {
          const skyState = Observe.getCurrentPeriod ? {
            period: Observe.getCurrentPeriod(),
            moonPhase: { name: '' },
            planets: {}
          } : reading.skyContext;
          reading.skyContext = skyState;
        } catch(e) {}

        const readingArea = document.getElementById('readingArea');
        readingArea.innerHTML = Divine.renderReading(reading);
        readingArea.classList.add('visible');
        readingArea.scrollIntoView({ behavior: 'smooth' });

        btn.textContent = originalText;
        btn.disabled = false;

        updateMemoryStats();
      }, 1200);

    } catch(err) {
      console.error('Reveal failed:', err);
      btn.textContent = 'Error — Check Console';
      btn.disabled = false;
    }
  }

  // ─── RESET ─────────────────────────────
  function reset() {
    currentDraw = null;

    ['cardPast','cardPresent','cardFuture'].forEach(id => {
      document.getElementById(id).classList.remove('flipped');
    });

    document.getElementById('readingArea').classList.remove('visible');
    document.getElementById('readingArea').innerHTML = '';
    document.getElementById('revealBtn').disabled = false;
    document.getElementById('revealBtn').textContent = '▸ Reveal';

    setTimeout(() => {
      ['frontPast','frontPresent','frontFuture'].forEach(id => {
        document.getElementById(id).innerHTML = '';
      });
    }, 400);
  }

  // ─── PUBLIC ────────────────────────────
  return { init, reveal, reset, setMode };
})();

document.addEventListener('DOMContentLoaded', () => {
  App.init();
});
