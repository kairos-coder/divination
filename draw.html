<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Draw — Digital Divination</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gold:         #d4a840;
  --gold-light:   #f0d878;
  --gold-dark:    #8a6518;
  --gold-dim:     #4a3510;
  --void:         #060610;
  --deep:         #0c0c1e;
  --surface:      #181838;
  --surface2:     #202048;
  --border:       #2a2a4a;
  --border-gold:  rgba(212,168,64,0.2);
  --text:         #f0ead8;
  --text-mid:     #d0c0a0;
  --text-dim:     #988870;
  --fire:         #c94a2a;
  --earth:        #6a8a3a;
  --water:        #66aacc;
  --air:          #aa88cc;
  --sage:         #8ab87a;
  --nav-h:        56px;
}

html { scroll-behavior: smooth; }

body {
  background: var(--void);
  background-image:
    radial-gradient(ellipse 70% 50% at 10% 5%,  #120828 0%, transparent 55%),
    radial-gradient(ellipse 50% 40% at 90% 95%, #081420 0%, transparent 55%),
    radial-gradient(ellipse 30% 60% at 80% 20%,  #0a0820 0%, transparent 50%);
  font-family: 'Cormorant Garamond', Georgia, serif;
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* ── MOSAIC ─────────────────────────────────── */
#cardMosaic {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  display: grid; grid-template-columns: repeat(6, 1fr);
  opacity: 0.18;
}
/* Reduce grid on mobile — perf + visual clarity */
@media (max-width: 600px) {
  #cardMosaic { grid-template-columns: repeat(3, 1fr); opacity: 0.12; }
}
#cardMosaic img {
  width: 100%; aspect-ratio: 2/3; object-fit: cover;
  filter: sepia(0.15) brightness(0.9);
  transition: transform 0.5s;
}

#pontusAmbient {
  position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.04;
  mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 15%, transparent 70%);
  -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 15%, transparent 70%);
}

#drawOverlay {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background:
    radial-gradient(ellipse 60% 70% at 50% 50%, rgba(6,6,16,0.55) 0%, transparent 70%),
    linear-gradient(to bottom, rgba(6,6,16,0.7) 0%, rgba(6,6,16,0.3) 30%, rgba(6,6,16,0.3) 70%, rgba(6,6,16,0.7) 100%);
}

/* ── NAV ────────────────────────────────────── */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--nav-h);
  background: rgba(8,8,20,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-gold);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  z-index: 200;
}

.nav-brand { display: flex; flex-direction: column; gap: 1px; flex-shrink: 0; }
.nav-brand-title { font-family: 'Cinzel Decorative', serif; font-size: 13px; color: var(--gold); letter-spacing: 1.5px; }
.nav-brand-sub { font-family: 'Cinzel', serif; font-size: 7px; letter-spacing: 5px; color: var(--gold-dark); text-transform: uppercase; }

/* Desktop nav links */
.nav-links {
  display: flex; gap: 16px; list-style: none;
}
.nav-links a {
  font-family: 'Cinzel', serif; font-size: 8px; letter-spacing: 3px;
  text-transform: uppercase; color: var(--text-dim); text-decoration: none;
  transition: color 0.2s; padding: 4px 0;
}
.nav-links a:hover { color: var(--gold-light); }

/* Hamburger — hidden on desktop */
.nav-hamburger {
  display: none;
  flex-direction: column; gap: 5px;
  background: none; border: none; cursor: pointer; padding: 4px;
  -webkit-tap-highlight-color: transparent;
}
.nav-hamburger span {
  display: block; width: 22px; height: 1.5px;
  background: var(--gold); border-radius: 2px;
  transition: all 0.25s;
}
.nav-hamburger.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
.nav-hamburger.open span:nth-child(2) { opacity: 0; }
.nav-hamburger.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

/* Mobile drawer */
.nav-drawer {
  display: none;
  position: fixed;
  top: var(--nav-h); left: 0; right: 0;
  background: rgba(8,8,20,0.97);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-gold);
  z-index: 199;
  padding: 16px 0;
  transform: translateY(-8px);
  opacity: 0;
  transition: opacity 0.2s, transform 0.2s;
  pointer-events: none;
}
.nav-drawer.open {
  opacity: 1; transform: translateY(0); pointer-events: auto;
}
.nav-drawer ul { list-style: none; }
.nav-drawer ul li a {
  display: block;
  font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 4px;
  text-transform: uppercase; color: var(--text-dim); text-decoration: none;
  padding: 14px 24px;
  border-bottom: 1px solid rgba(42,42,74,0.4);
  transition: color 0.2s, background 0.2s;
}
.nav-drawer ul li:last-child a { border-bottom: none; }
.nav-drawer ul li a:hover,
.nav-drawer ul li a:active { color: var(--gold); background: rgba(212,168,64,0.05); }

@media (max-width: 600px) {
  .nav-links { display: none; }
  .nav-hamburger { display: flex; }
  .nav-drawer { display: block; }
}

/* ── LAYOUT ─────────────────────────────────── */
.table-container {
  padding: 80px 16px 48px;
  max-width: 700px;
  margin: 0 auto;
  position: relative;
  z-index: 2;
}

.table-header {
  text-align: center;
  margin-bottom: 20px;
}
.table-header h1 {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(20px, 5vw, 32px);
  color: var(--gold-light);
  text-shadow: 0 0 60px rgba(212,168,64,0.2);
  line-height: 1.2;
}
.table-subtitle {
  font-style: italic; color: var(--text-mid);
  margin-top: 8px; font-size: clamp(13px, 3vw, 15px);
}

.sky-badge {
  text-align: center; margin-bottom: 14px;
  font-family: 'Cinzel', serif; font-size: 0.6rem;
  letter-spacing: 0.12em; color: var(--text-dim); min-height: 1.5rem;
}
.sky-badge .period-dot {
  display: inline-block; width: 6px; height: 6px;
  border-radius: 50%; margin-right: 6px; vertical-align: middle;
}
.sky-badge .period-dot.sun  { background: var(--gold);  box-shadow: 0 0 8px var(--gold); }
.sky-badge .period-dot.moon { background: var(--water); box-shadow: 0 0 8px var(--water); }

.db-status {
  text-align: center; margin-bottom: 10px;
  font-size: 0.5rem; font-family: 'Cinzel', serif;
  letter-spacing: 0.1em; color: var(--text-dim); opacity: 0.7;
}
.db-status.connected { color: var(--sage); }
.db-status.offline   { color: var(--fire); }

/* ── SIGN SELECTOR ──────────────────────────── */
.sign-selector { text-align: center; margin-bottom: 14px; }
.sign-selector label {
  font-family: 'Cinzel', serif; font-size: 0.5rem;
  letter-spacing: 0.15em; color: var(--text-dim);
  display: block; margin-bottom: 6px;
}
.sign-selector select {
  font-family: 'Cinzel', serif; font-size: 0.65rem;
  background: rgba(24,24,56,0.75);
  border: 1px solid var(--border);
  color: var(--text); padding: 10px 16px;
  border-radius: 6px; cursor: pointer;
  max-width: 260px; width: 100%;
  backdrop-filter: blur(8px);
  -webkit-appearance: none; appearance: none;
  text-align: center;
  /* Bigger tap target on mobile */
  min-height: 44px;
}
.sign-selector select:focus { border-color: var(--gold); outline: none; }

/* ── QUESTION INPUT ─────────────────────────── */
.question-area { text-align: center; margin-bottom: 18px; }
.question-input {
  background: rgba(24,24,56,0.75);
  border: 1px solid var(--border); border-radius: 8px;
  color: var(--text); font-family: 'Cormorant Garamond', serif;
  font-size: clamp(15px, 4vw, 17px); font-style: italic;
  padding: 12px 18px; width: 100%; max-width: 460px;
  text-align: center; transition: border-color 0.3s;
  backdrop-filter: blur(8px);
  /* Prevent iOS zoom on focus (font-size must be ≥16px or we override) */
  font-size: 16px;
  min-height: 48px;
}
.question-input:focus { outline: none; border-color: var(--gold); }
.question-input::placeholder { color: var(--text-dim); opacity: 0.5; }

/* ── DECK SELECTOR ──────────────────────────── */
.deck-selector {
  text-align: center; margin-bottom: 18px;
  display: flex; gap: 6px; justify-content: flex-start;
  flex-wrap: nowrap;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scroll-snap-type: x mandatory;
  padding-bottom: 6px;
  /* Hide scrollbar but keep scrollability */
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.deck-selector::-webkit-scrollbar { display: none; }

/* Faint fade hints at edges on mobile */
@media (max-width: 600px) {
  .deck-selector {
    /* Pad so first/last items aren't flush to edge */
    padding-left: 4px;
    padding-right: 4px;
    mask-image: linear-gradient(to right, transparent 0, black 12px, black calc(100% - 12px), transparent 100%);
    -webkit-mask-image: linear-gradient(to right, transparent 0, black 12px, black calc(100% - 12px), transparent 100%);
  }
}

.deck-option {
  font-family: 'Cinzel', serif; font-size: 7px;
  letter-spacing: 2px; text-transform: uppercase;
  padding: 8px 14px; border-radius: 20px;
  border: 1px solid var(--border);
  background: rgba(24,24,56,0.6);
  color: var(--text-dim); cursor: pointer;
  transition: all 0.2s; white-space: nowrap;
  backdrop-filter: blur(6px);
  -webkit-tap-highlight-color: transparent;
  scroll-snap-align: start;
  flex-shrink: 0;
  /* Tap target */
  min-height: 36px;
  display: inline-flex; align-items: center; justify-content: center;
}
.deck-option:hover { border-color: var(--border-gold); color: var(--text-mid); }
.deck-option.active                  { border-color: var(--gold);  color: var(--gold);  background: rgba(212,168,64,0.08); }
.deck-option.suit-fire.active        { border-color: var(--fire);  color: var(--fire);  background: rgba(201,74,42,0.08); }
.deck-option.suit-water.active       { border-color: var(--water); color: var(--water); background: rgba(102,170,204,0.08); }
.deck-option.suit-earth.active       { border-color: var(--earth); color: var(--earth); background: rgba(106,138,58,0.08); }
.deck-option.suit-air.active         { border-color: var(--air);   color: var(--air);   background: rgba(170,136,204,0.08); }

/* ── BUTTON ROW ─────────────────────────────── */
.button-row {
  text-align: center; margin-bottom: 28px;
  display: flex; gap: 10px;
  justify-content: center; align-items: center;
  flex-wrap: wrap;
}
.btn-reveal {
  font-family: 'Cinzel', serif; font-size: 11px;
  letter-spacing: 3px; text-transform: uppercase;
  color: #0a0a0a;
  background: linear-gradient(135deg, var(--gold), var(--gold-light));
  border: none; padding: 13px 32px; border-radius: 8px;
  cursor: pointer; transition: all 0.3s;
  box-shadow: 0 0 30px rgba(212,168,64,0.2);
  -webkit-tap-highlight-color: transparent;
  min-height: 48px; min-width: 140px;
}
.btn-reveal:hover { box-shadow: 0 0 50px rgba(212,168,64,0.45); transform: translateY(-2px); }
.btn-reveal:active { transform: translateY(0); box-shadow: 0 0 20px rgba(212,168,64,0.3); }
.btn-reveal:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

.btn-new {
  font-family: 'Cinzel', serif; font-size: 8px;
  letter-spacing: 3px; text-transform: uppercase;
  color: var(--text-dim); background: transparent;
  border: 1px solid var(--border); border-radius: 6px;
  padding: 10px 20px; cursor: pointer; transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
  min-height: 48px;
}
.btn-new:hover { border-color: var(--gold); color: var(--gold); }
.btn-new:active { background: rgba(212,168,64,0.05); }

/* ── SPREAD ─────────────────────────────────── */
.spread {
  display: flex; gap: 12px;
  justify-content: center; align-items: flex-start;
  flex-wrap: nowrap;         /* row by default */
  margin-bottom: 32px; min-height: 200px;
}
.card-slot {
  flex: 1; min-width: 0;
  max-width: 200px;
  perspective: 1000px;
}

/* Mobile: horizontal strip that fits 3 cards side by side */
@media (max-width: 500px) {
  .spread {
    gap: 8px;
  }
  .card-slot {
    /* Cards fill width evenly, no min forcing overflow */
    flex: 1 1 0;
    max-width: none;
  }
}

.card-inner {
  position: relative; width: 100%; aspect-ratio: 2/3;
  transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  transform-style: preserve-3d;
}
.card-inner.flipped { transform: rotateY(180deg); }

.card-face {
  position: absolute; inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 10px; overflow: hidden;
  border: 1px solid var(--border);
}
.card-back {
  background: var(--surface2);
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--border-gold);
}
.card-back-design { text-align: center; }
.card-back-sigil  { font-size: clamp(20px, 5vw, 36px); opacity: 0.6; }
.card-back-text   {
  font-family: 'Cinzel', serif; font-size: clamp(5px, 1.5vw, 7px);
  letter-spacing: 4px; color: var(--gold);
  text-transform: uppercase; margin-top: 6px; opacity: 0.5;
}

.card-front {
  background: var(--surface); transform: rotateY(180deg);
  display: flex; flex-direction: column;
}
.card-front img {
  width: 100%; height: 55%; object-fit: cover;
  border-bottom: 1px solid var(--border-gold);
  background: var(--surface2);
}
.card-front .card-info {
  padding: clamp(6px, 2vw, 10px) clamp(6px, 2vw, 12px);
  flex: 1; display: flex; flex-direction: column; justify-content: center;
}

/* Card text — scales with card width via clamp */
.card-position {
  font-family: 'Cinzel', serif;
  font-size: clamp(5px, 1.4vw, 7px);
  letter-spacing: 2px; text-transform: uppercase;
  color: var(--gold); opacity: 0.6; margin-bottom: 2px;
}
.card-name {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(8px, 2.2vw, 12px);
  color: var(--gold-light); line-height: 1.2;
}
.card-domain {
  font-family: 'Cinzel', serif;
  font-size: clamp(5px, 1.4vw, 7px);
  letter-spacing: 2px; color: var(--text-dim);
  text-transform: uppercase; margin-top: 2px;
}
.card-overlay {
  font-size: clamp(7px, 1.8vw, 10px);
  font-style: italic; color: var(--text-mid);
  margin-top: 3px; line-height: 1.4;
}

.img-placeholder {
  width: 100%; height: 55%;
  background: var(--surface2);
  display: flex; align-items: center; justify-content: center;
  font-size: clamp(20px, 5vw, 32px); opacity: 0.3;
  border-bottom: 1px solid var(--border-gold);
}

/* ── READING AREA ────────────────────────────── */
.reading-area {
  max-width: 600px; margin: 0 auto 40px;
  padding: clamp(16px, 4vw, 24px) clamp(14px, 4vw, 20px);
  background: rgba(24,24,56,0.75);
  border: 1px solid var(--border); border-radius: 12px;
  backdrop-filter: blur(12px); display: none;
}
.reading-area.visible {
  display: block;
  animation: fadeUp 0.6s ease;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
.reading-header {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(13px, 4vw, 16px);
  color: var(--gold-light); text-align: center; margin-bottom: 20px;
}
.reading-sky      { text-align: center; font-size: 0.7rem; color: var(--text-dim); margin-bottom: 16px; font-style: italic; }
.reading-block    { margin-bottom: 16px; padding-left: 14px; border-left: 2px solid var(--border-gold); }
.reading-position { font-family: 'Cinzel', serif; font-size: 8px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }
.reading-text     { font-size: clamp(13px, 3.5vw, 14px); font-style: italic; color: var(--text-mid); line-height: 1.7; }
.reading-synthesis {
  margin-top: 20px; padding-top: 16px;
  border-top: 1px solid var(--border-gold);
  font-size: clamp(13px, 3.8vw, 15px); font-style: italic;
  color: var(--text); line-height: 1.8; text-align: center;
}

.saved-indicator {
  text-align: center; font-family: 'Cinzel', serif;
  font-size: 0.5rem; letter-spacing: 0.15em;
  color: var(--text-dim); margin-top: 12px;
}
.saved-indicator.cloud { color: var(--sage); }

.gaia-stats {
  text-align: center; margin-top: 16px;
  font-family: 'Cinzel', serif; font-size: 0.5rem;
  letter-spacing: 0.1em; color: var(--text-dim); opacity: 0.6;
}

/* ── SAFE AREA (notch/home bar) ─────────────── */
@supports (padding-bottom: env(safe-area-inset-bottom)) {
  .table-container {
    padding-bottom: calc(48px + env(safe-area-inset-bottom));
  }
}
</style>
</head>
<body>

<div id="cardMosaic"></div>
<canvas id="pontusAmbient"></canvas>
<div id="drawOverlay"></div>

<nav>
  <div class="nav-brand">
    <div class="nav-brand-title">Digital Divination</div>
    <div class="nav-brand-sub">Aspects of the Divine</div>
  </div>
  <ul class="nav-links">
    <li><a href="index.html">Temple</a></li>
    <li><a href="zodiac.html">Zodiac</a></li>
    <li><a href="daily.html">Daily</a></li>
    <li><a href="archive.html">Archive</a></li>
  </ul>
  <button class="nav-hamburger" id="navHamburger" aria-label="Menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="nav-drawer" id="navDrawer" aria-hidden="true">
  <ul>
    <li><a href="index.html">Temple</a></li>
    <li><a href="zodiac.html">Zodiac</a></li>
    <li><a href="daily.html">Daily</a></li>
    <li><a href="archive.html">Archive</a></li>
  </ul>
</div>

<div class="table-container">

  <div class="table-header">
    <h1>🜏 Draw Three Cards</h1>
    <div class="table-subtitle">Past · Present · Future</div>
  </div>

  <div class="db-status" id="dbStatus"></div>
  <div class="sky-badge" id="skyBadge"></div>

  <div class="sign-selector">
    <label>Your Sign</label>
    <select id="birthSign">
      <option value="">— Select your sign —</option>
    </select>
  </div>

  <div class="question-area">
    <input type="text" class="question-input" id="questionInput"
           placeholder="What question do you bring to the cards?"
           maxlength="200" autocomplete="off" autocorrect="off" spellcheck="false">
  </div>

  <div class="deck-selector">
    <button class="deck-option active"    data-deck="major" onclick="App.setMode('major')">Major Arcana</button>
    <button class="deck-option suit-fire"  data-deck="fire"  onclick="App.setMode('fire')">🔥 Fire</button>
    <button class="deck-option suit-water" data-deck="water" onclick="App.setMode('water')">🌊 Water</button>
    <button class="deck-option suit-earth" data-deck="earth" onclick="App.setMode('earth')">🜃 Earth</button>
    <button class="deck-option suit-air"   data-deck="air"   onclick="App.setMode('air')">💨 Air</button>
    <button class="deck-option"            data-deck="full"  onclick="App.setMode('full')">Full Deck</button>
  </div>

  <div class="button-row">
    <button class="btn-reveal" id="revealBtn" onclick="App.reveal()">▸ Reveal</button>
    <button class="btn-new" onclick="App.reset()">New Reading</button>
  </div>

  <div class="spread" id="spread">
    <div class="card-slot" id="slotPast">
      <div class="card-inner" id="cardPast">
        <div class="card-face card-back">
          <div class="card-back-design">
            <div class="card-back-sigil">🜏</div>
            <div class="card-back-text">Past</div>
          </div>
        </div>
        <div class="card-face card-front" id="frontPast"></div>
      </div>
    </div>

    <div class="card-slot" id="slotPresent">
      <div class="card-inner" id="cardPresent">
        <div class="card-face card-back">
          <div class="card-back-design">
            <div class="card-back-sigil">🜏</div>
            <div class="card-back-text">Present</div>
          </div>
        </div>
        <div class="card-face card-front" id="frontPresent"></div>
      </div>
    </div>

    <div class="card-slot" id="slotFuture">
      <div class="card-inner" id="cardFuture">
        <div class="card-face card-back">
          <div class="card-back-design">
            <div class="card-back-sigil">🜏</div>
            <div class="card-back-text">Future</div>
          </div>
        </div>
        <div class="card-face card-front" id="frontFuture"></div>
      </div>
    </div>
  </div>

  <div class="reading-area" id="readingArea"></div>
  <div class="gaia-stats" id="gaiaStats"></div>

// ─── PONTUS AMBIENT ───────────────────────────
const pCvs = document.getElementById('pontusAmbient');
const pCtx = pCvs.getContext('2d');

function resizePontus() {
  pCvs.width  = window.innerWidth;
  pCvs.height = window.innerHeight;
}
window.addEventListener('resize', resizePontus);
resizePontus();

const TITANS   = ['Oceanus','Tethys','Pontus','Nereus','Doris','Thaumas','Phorcys','Ceto'];
const pOffsets = TITANS.map(() => Math.random() * Math.PI * 2);

function drawPontus() {
  const W = pCvs.width, H = pCvs.height;
  pCtx.clearRect(0, 0, W, H);
  for (let d = TITANS.length - 1; d >= 0; d--) {
    pOffsets[d] += 0.008 * (0.6 + d * 0.07);
    const baseY = H * 0.25 + (d * (H * 0.095));
    const amp   = 5 + d * 1.4;
    const freq  = 0.012 + d * 0.002;
    const b     = 35 + d * 10;
    pCtx.beginPath();
    pCtx.moveTo(0, H);
    for (let x = 0; x <= W; x += 4) {
      const y = baseY
        + Math.sin(x * freq + pOffsets[d]) * amp
        + Math.sin(x * freq * 2.3 + pOffsets[d] * 0.7) * (amp * 0.28);
      pCtx.lineTo(x, y);
    }
    pCtx.lineTo(W, H);
    pCtx.closePath();
    pCtx.fillStyle = `rgba(${14 + d * 3},${48 + b},${140 + d * 8},${0.16 + d * 0.03})`;
    pCtx.fill();
  }
  requestAnimationFrame(drawPontus);
}
drawPontus();

// ─── APP CONTROLLER ──────────────────────────
const App = (() => {
  let mode = 'major';
  let currentReading = null;
  let supabaseClient = null;

  const SIGNS = ['Aries','Taurus','Gemini','Cancer','Leo','Virgo','Libra','Scorpio','Sagittarius','Capricorn','Aquarius','Pisces'];
  const SIGN_GLYPHS = {'Aries':'♈','Taurus':'♉','Gemini':'♊','Cancer':'♋','Leo':'♌','Virgo':'♍','Libra':'♎','Scorpio':'♏','Sagittarius':'♐','Capricorn':'♑','Aquarius':'♒','Pisces':'♓'};

  function initSupabase() {
    if (window.supabase && !supabaseClient) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      console.log('DivineDB client ready');
    }
  }

  async function saveReadingToDivineDB(readingData) {
    if (!supabaseClient) { initSupabase(); if (!supabaseClient) return null; }
    try {
      const record = {
        id: crypto.randomUUID(),
        timestamp: new Date().toISOString(),
        period: readingData.period || 'UNKNOWN',
        past_card: readingData.past?.name || readingData.cards?.past?.name,
        present_card: readingData.present?.name || readingData.cards?.present?.name,
        future_card: readingData.future?.name || readingData.cards?.future?.name,
        reading_text: readingData.synthesis || readingData.reading_text,
        user_question: readingData.question,
        deck_mode: mode,
        birth_sign: readingData.birthSign
      };
      const { data, error } = await supabaseClient.from('readings').insert([record]);
      if (error) { console.warn('DivineDB save failed:', error.message); return null; }
      console.log('✅ Reading saved to DivineDB, ID:', data[0].id);
      updateGaiaStats();
      return data[0];
    } catch (err) {
      console.warn('DivineDB save exception:', err.message);
      return null;
    }
  }

  async function updateGaiaStats() {
    const el = document.getElementById('gaiaStats');
    if (!supabaseClient) { initSupabase(); if (!supabaseClient) return; }
    try {
      const { count, error } = await supabaseClient
        .from('readings').select('*', { count: 'exact', head: true });
      if (error) throw error;
      if (el) el.textContent = `📚 ${count || 0} readings in DivineDB`;
    } catch(e) { if (el) el.textContent = ''; }
  }

  function updateDBStatus() {
    const el = document.getElementById('dbStatus');
    if (supabaseClient) {
      el.className = 'db-status connected';
      el.textContent = '📖 Connected to DivineDB';
    } else {
      el.className = 'db-status offline';
      el.textContent = '💾 Offline — readings saved locally';
    }
  }

  async function init() {
    initSupabase();
    updateDBStatus();
    updateGaiaStats();

    const sel = document.getElementById('birthSign');
    SIGNS.forEach(sign => {
      const o = document.createElement('option');
      o.value = sign;
      o.textContent = `${SIGN_GLYPHS[sign]} ${sign}`;
      sel.appendChild(o);
    });

    updateSkyBadge();
    try { await Divine.loadDecks(); } catch(e) { console.warn('Deck preload failed:', e.message); }
  }

  function updateSkyBadge() {
    const badge = document.getElementById('skyBadge');
    try {
      const period = Observe.getCurrentPeriod();
      const moonAspect = Observe.getMoonAspect();
      const dotClass = period === 'SUN' ? 'sun' : 'moon';
      const label = period === 'SUN' ? 'Solar Reading' : 'Lunar Reading';
      badge.innerHTML = `<span class="period-dot ${dotClass}"></span> ${label} · Moon: ${moonAspect}`;
    } catch(e) {
      badge.innerHTML = 'Sky unavailable · offline reading';
    }
  }

  async function getCurrentPeriod() {
    try {
      const sky = await Observe.getSkyState();
      return sky.period;
    } catch(e) { return Observe.getCurrentPeriod(); }
  }

  function setMode(newMode) {
    mode = newMode;
    document.querySelectorAll('.deck-option').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.deck === mode);
    });
    reset();
  }

  async function reveal() {
    const btn = document.getElementById('revealBtn');
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Shuffling...';

    try {
      await Divine.loadDecks();

      const question  = document.getElementById('questionInput').value.trim() || null;
      const birthSign = document.getElementById('birthSign').value || null;
      const period    = await getCurrentPeriod();

      const pool = mode === 'major' ? Divine.getMajorDeck() :
                   ['fire','water','earth','air'].includes(mode) ?
                     Divine.getMinorDeck().filter(c => c.element && c.element.toLowerCase() === mode) :
                   Divine.getFullDeck();

      if (pool.length === 0) throw new Error('No cards in selected deck');

      const [past, present] = Divine.uniformDraw(pool, 2);

      let future;
      try {
        const skyState = await Observe.getSkyState();
        skyState.moonAspect = Observe.getMoonAspect();
        const allCards = Divine.getFullDeck();
        const weights  = Weight.calculate(skyState, past, present, allCards);
        const futureDraw = Divine.weightedDraw(allCards, 1, weights);
        future = futureDraw[0];
      } catch(e) {
        console.warn('Weighted draw failed, using uniform:', e.message);
        const futurePool = pool.filter(c => c.id !== past.id && c.id !== present.id);
        future = Divine.uniformDraw(futurePool.length > 0 ? futurePool : pool, 1)[0];
      }

      currentReading = { past, present, future, question, period, birthSign };

      document.getElementById('frontPast').innerHTML    = Divine.renderCard(past,    'past');
      document.getElementById('frontPresent').innerHTML = Divine.renderCard(present, 'present');
      document.getElementById('frontFuture').innerHTML  = Divine.renderCard(future,  'future');

      const cardPast    = document.getElementById('cardPast');
      const cardPresent = document.getElementById('cardPresent');
      const cardFuture  = document.getElementById('cardFuture');

      cardPast.classList.remove('flipped');
      cardPresent.classList.remove('flipped');
      cardFuture.classList.remove('flipped');
      void cardPast.offsetWidth;

      setTimeout(() => cardPast.classList.add('flipped'),    100);
      setTimeout(() => cardPresent.classList.add('flipped'), 400);
      setTimeout(() => cardFuture.classList.add('flipped'),  700);

      setTimeout(async () => {
        const reading = {
          cards: { past, present, future },
          question: question || 'The unspoken question',
          skyContext: {}, synthesis: ''
        };
        try {
          const skyState = Observe.getCurrentPeriod ? {
            period: Observe.getCurrentPeriod(),
            moonPhase: { name: '' }, planets: {}
          } : reading.skyContext;
          reading.skyContext = skyState;
        } catch(e) {}

        const readingHtml = Divine.renderReading(reading);
        const readingArea = document.getElementById('readingArea');
        readingArea.innerHTML = readingHtml;
        readingArea.classList.add('visible');
        readingArea.scrollIntoView({ behavior: 'smooth', block: 'start' });

        const synthesisMatch = readingHtml.match(/<div class="reading-synthesis">(.*?)<\/div>/s);
        const synthesis = synthesisMatch ? synthesisMatch[1].replace(/<[^>]*>/g, '') : '';

        await saveReadingToDivineDB({ period, past, present, future, synthesis, question, birthSign });

        btn.textContent = originalText;
        btn.disabled = false;
      }, 1200);

    } catch(err) {
      console.error('Reveal failed:', err);
      btn.textContent = 'Error — Try Again';
      btn.disabled = false;
    }
  }

  function reset() {
    currentReading = null;
    ['cardPast','cardPresent','cardFuture'].forEach(id => {
      document.getElementById(id).classList.remove('flipped');
    });
    document.getElementById('readingArea').classList.remove('visible');
    document.getElementById('readingArea').innerHTML = '';
    document.getElementById('revealBtn').disabled = false;
    document.getElementById('revealBtn').textContent = '▸ Reveal';
    setTimeout(() => {
      ['frontPast','frontPresent','frontFuture'].forEach(id => {
        document.getElementById(id).innerHTML = '';
      });
    }, 400);
  }

  return { init, reveal, reset, setMode };
})();

document.addEventListener('DOMContentLoaded', () => App.init());
</script>
