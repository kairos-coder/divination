<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Draw — Digital Divination</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gold:         #d4a840;
  --gold-light:   #f0d878;
  --gold-dark:    #8a6518;
  --gold-dim:     #4a3510;
  --void:         #060610;
  --deep:         #0c0c1e;
  --surface:      #181838;
  --surface2:     #202048;
  --border:       #2a2a4a;
  --border-gold:  rgba(212,168,64,0.2);
  --text:         #f0ead8;
  --text-mid:     #d0c0a0;
  --text-dim:     #988870;
  --fire:         #c94a2a;
  --earth:        #6a8a3a;
  --water:        #66aacc;
  --air:          #aa88cc;
  --sage:         #8ab87a;
}

html { scroll-behavior: smooth; }

body {
  background: var(--void);
  background-image:
    radial-gradient(ellipse 70% 50% at 10% 5%,  #120828 0%, transparent 55%),
    radial-gradient(ellipse 50% 40% at 90% 95%, #081420 0%, transparent 55%),
    radial-gradient(ellipse 30% 60% at 80% 20%,  #0a0820 0%, transparent 50%);
  font-family: 'Cormorant Garamond', Georgia, serif;
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* ── MOSAIC BACKGROUND ── */
#cardMosaic {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  display: grid; grid-template-columns: repeat(6, 1fr);
  opacity: 0.18;
}
#cardMosaic img {
  width: 100%; aspect-ratio: 2/3; object-fit: cover;
  filter: sepia(0.15) brightness(0.9);
  transition: transform 0.5s;
}
#cardMosaic img:hover { transform: scale(1.02); }

/* ── PONTUS AMBIENT CANVAS ── */
#pontusAmbient {
  position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.04;
  mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 15%, transparent 70%);
  -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 15%, transparent 70%);
}

/* ── SHADED OVERLAY ── */
#drawOverlay {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background:
    radial-gradient(ellipse 60% 70% at 50% 50%, rgba(6,6,16,0.55) 0%, transparent 70%),
    linear-gradient(to bottom, rgba(6,6,16,0.7) 0%, rgba(6,6,16,0.3) 30%, rgba(6,6,16,0.3) 70%, rgba(6,6,16,0.7) 100%);
}

nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 56px;
  background: rgba(8,8,20,0.88);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-gold);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  z-index: 200;
}

.nav-brand { display: flex; flex-direction: column; gap: 1px; }
.nav-brand-title { font-family: 'Cinzel Decorative', serif; font-size: 13px; color: var(--gold); letter-spacing: 1.5px; }
.nav-brand-sub { font-family: 'Cinzel', serif; font-size: 7px; letter-spacing: 5px; color: var(--gold-dark); text-transform: uppercase; }

.nav-links { display: flex; gap: 16px; list-style: none; flex-wrap: wrap; justify-content: flex-end; }
.nav-links a { font-family: 'Cinzel', serif; font-size: 8px; letter-spacing: 3px; text-transform: uppercase; color: var(--text-dim); text-decoration: none; transition: color 0.2s; padding: 4px 0; }
.nav-links a:hover { color: var(--gold-light); }

.table-container {
  padding: 80px 16px 40px;
  max-width: 700px;
  margin: 0 auto;
  position: relative;
  z-index: 2;
}

.table-header {
  text-align: center;
  margin-bottom: 24px;
}

.table-header h1 {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(20px, 4vw, 32px);
  color: var(--gold-light);
  text-shadow: 0 0 60px rgba(212,168,64,0.2);
}

.table-subtitle {
  font-style: italic;
  color: var(--text-mid);
  margin-top: 6px;
  font-size: 15px;
}

/* Sky badge */
.sky-badge {
  text-align: center;
  margin-bottom: 16px;
  font-family: 'Cinzel', serif;
  font-size: 0.6rem;
  letter-spacing: 0.12em;
  color: var(--text-dim);
  min-height: 1.5rem;
}
.sky-badge .period-dot {
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  margin-right: 6px;
  vertical-align: middle;
}
.sky-badge .period-dot.sun  { background: var(--gold);  box-shadow: 0 0 8px var(--gold); }
.sky-badge .period-dot.moon { background: var(--water); box-shadow: 0 0 8px var(--water); }

/* DB Status */
.db-status {
  text-align: center;
  margin-bottom: 12px;
  font-size: 0.5rem;
  font-family: 'Cinzel', serif;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  opacity: 0.7;
}
.db-status.connected { color: var(--sage); }
.db-status.offline   { color: var(--fire); }

.question-area {
  text-align: center;
  margin-bottom: 20px;
}

.question-input {
  background: rgba(24,24,56,0.75);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: 'Cormorant Garamond', serif;
  font-size: 17px;
  font-style: italic;
  padding: 12px 18px;
  width: 100%;
  max-width: 460px;
  text-align: center;
  transition: border-color 0.3s;
  backdrop-filter: blur(8px);
}

.question-input:focus {
  outline: none;
  border-color: var(--gold);
}

.question-input::placeholder {
  color: var(--text-dim);
  opacity: 0.5;
}

/* Sign selector */
.sign-selector {
  text-align: center;
  margin-bottom: 16px;
}

.sign-selector select {
  font-family: 'Cinzel', serif;
  font-size: 0.6rem;
  background: rgba(24,24,56,0.75);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  max-width: 260px;
  width: 100%;
  backdrop-filter: blur(8px);
  -webkit-appearance: none;
  appearance: none;
  text-align: center;
}

.sign-selector select:focus {
  border-color: var(--gold);
  outline: none;
}

.sign-selector label {
  font-family: 'Cinzel', serif;
  font-size: 0.5rem;
  letter-spacing: 0.15em;
  color: var(--text-dim);
  display: block;
  margin-bottom: 6px;
}

/* Deck selector */
.deck-selector {
  text-align: center;
  margin-bottom: 20px;
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
}

.deck-option {
  font-family: 'Cinzel', serif;
  font-size: 7px;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 7px 12px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: rgba(24,24,56,0.6);
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
  backdrop-filter: blur(6px);
  -webkit-tap-highlight-color: transparent;
}

.deck-option:hover { border-color: var(--border-gold); color: var(--text-mid); }

.deck-option.active                  { border-color: var(--gold);  color: var(--gold);  background: rgba(212,168,64,0.08); }
.deck-option.suit-fire.active        { border-color: var(--fire);  color: var(--fire);  background: rgba(201,74,42,0.08); }
.deck-option.suit-water.active       { border-color: var(--water); color: var(--water); background: rgba(102,170,204,0.08); }
.deck-option.suit-earth.active       { border-color: var(--earth); color: var(--earth); background: rgba(106,138,58,0.08); }
.deck-option.suit-air.active         { border-color: var(--air);   color: var(--air);   background: rgba(170,136,204,0.08); }

/* Spread */
.spread {
  display: flex;
  gap: 16px;
  justify-content: center;
  align-items: flex-start;
  flex-wrap: wrap;
  margin-bottom: 32px;
  min-height: 300px;
}

.card-slot {
  flex: 1;
  min-width: 140px;
  max-width: 220px;
  perspective: 1000px;
}

.card-inner {
  position: relative;
  width: 100%;
  aspect-ratio: 2/3;
  transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  transform-style: preserve-3d;
}

.card-inner.flipped {
  transform: rotateY(180deg);
}

.card-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid var(--border);
}

.card-back {
  background: var(--surface2);
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border-gold);
  cursor: default;
}

.card-back-design { text-align: center; }
.card-back-sigil  { font-size: 36px; opacity: 0.6; }
.card-back-text   { font-family: 'Cinzel', serif; font-size: 7px; letter-spacing: 4px; color: var(--gold); text-transform: uppercase; margin-top: 6px; opacity: 0.5; }

.card-front {
  background: var(--surface);
  transform: rotateY(180deg);
  display: flex;
  flex-direction: column;
}

.card-front img {
  width: 100%;
  height: 55%;
  object-fit: cover;
  border-bottom: 1px solid var(--border-gold);
  background: var(--surface2);
}

.card-front .card-info {
  padding: 10px 12px;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.card-position { font-family: 'Cinzel', serif; font-size: 7px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); opacity: 0.6; margin-bottom: 2px; }
.card-name     { font-family: 'Cinzel Decorative', serif; font-size: 12px; color: var(--gold-light); line-height: 1.2; }
.card-domain   { font-family: 'Cinzel', serif; font-size: 7px; letter-spacing: 2px; color: var(--text-dim); text-transform: uppercase; margin-top: 2px; }
.card-overlay  { font-size: 10px; font-style: italic; color: var(--text-mid); margin-top: 4px; line-height: 1.4; }

/* Buttons */
.button-row { text-align: center; margin-bottom: 32px; }

.btn-reveal {
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #0a0a0a;
  background: linear-gradient(135deg, var(--gold), var(--gold-light));
  border: none;
  padding: 12px 32px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 0 30px rgba(212,168,64,0.2);
  -webkit-tap-highlight-color: transparent;
}

.btn-reveal:hover {
  box-shadow: 0 0 50px rgba(212,168,64,0.45);
  transform: translateY(-2px);
}

.btn-reveal:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  transform: none;
}

.btn-new {
  font-family: 'Cinzel', serif;
  font-size: 8px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--text-dim);
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 9px 20px;
  cursor: pointer;
  transition: all 0.2s;
  margin-left: 10px;
  -webkit-tap-highlight-color: transparent;
}

.btn-new:hover { border-color: var(--gold); color: var(--gold); }

/* Reading result */
.reading-area {
  max-width: 600px;
  margin: 0 auto 40px;
  padding: 24px 20px;
  background: rgba(24,24,56,0.75);
  border: 1px solid var(--border);
  border-radius: 12px;
  backdrop-filter: blur(12px);
  display: none;
}

.reading-area.visible {
  display: block;
  animation: fadeUp 0.6s ease;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

.reading-header   { font-family: 'Cinzel Decorative', serif; font-size: 16px; color: var(--gold-light); text-align: center; margin-bottom: 20px; }
.reading-sky      { text-align: center; font-size: 0.7rem; color: var(--text-dim); margin-bottom: 16px; font-style: italic; }
.reading-block    { margin-bottom: 16px; padding-left: 14px; border-left: 2px solid var(--border-gold); }
.reading-position { font-family: 'Cinzel', serif; font-size: 8px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }
.reading-text     { font-size: 14px; font-style: italic; color: var(--text-mid); line-height: 1.7; }

.reading-synthesis {
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--border-gold);
  font-size: 15px;
  font-style: italic;
  color: var(--text);
  line-height: 1.8;
  text-align: center;
}

.saved-indicator {
  text-align: center;
  font-family: 'Cinzel', serif;
  font-size: 0.5rem;
  letter-spacing: 0.15em;
  color: var(--text-dim);
  margin-top: 12px;
}
.saved-indicator.cloud { color: var(--sage); }

/* Stats */
.gaia-stats {
  text-align: center;
  margin-top: 16px;
  font-family: 'Cinzel', serif;
  font-size: 0.5rem;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  opacity: 0.6;
}

.img-placeholder {
  width: 100%; height: 55%;
  background: var(--surface2);
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; opacity: 0.3;
  border-bottom: 1px solid var(--border-gold);
}

@media (max-width: 600px) {
  nav { padding: 0 12px; }
  .nav-links { gap: 10px; }
  .nav-links a { font-size: 7px; letter-spacing: 2px; }
  .spread { flex-direction: column; align-items: center; gap: 12px; }
  .card-slot { max-width: 180px; }
  .deck-option { font-size: 6px; padding: 6px 10px; }
  .table-container { padding: 70px 10px 30px; }
}
</style>
</head>
<body>

<!-- 6×6 card mosaic -->
<div id="cardMosaic"></div>

<!-- Pontus ambient wave canvas -->
<canvas id="pontusAmbient"></canvas>

<!-- Darkening overlay -->
<div id="drawOverlay"></div>

<nav>
  <div class="nav-brand">
    <div class="nav-brand-title">Digital Divination</div>
    <div class="nav-brand-sub">Aspects of the Divine</div>
  </div>
  <ul class="nav-links">
    <li><a href="index.html">Temple</a></li>
    <li><a href="zodiac.html">Zodiac</a></li>
    <li><a href="daily.html">Daily</a></li>
    <li><a href="archive.html">Archive</a></li>
  </ul>
</nav>

<div class="table-container">

  <div class="table-header">
    <h1>🜏 Draw Three Cards</h1>
    <div class="table-subtitle">Past · Present · Future</div>
  </div>

  <!-- DivineDB status -->
  <div class="db-status" id="dbStatus"></div>

  <!-- Sky badge -->
  <div class="sky-badge" id="skyBadge"></div>

  <!-- Birth sign -->
  <div class="sign-selector">
    <label>Your Sign</label>
    <select id="birthSign">
      <option value="">— Select your sign —</option>
    </select>
  </div>

  <!-- Question -->
  <div class="question-area">
    <input type="text" class="question-input" id="questionInput"
           placeholder="What question do you bring to the cards?"
           maxlength="200">
  </div>

  <!-- Deck selector -->
  <div class="deck-selector">
    <button class="deck-option active"    data-deck="major" onclick="App.setMode('major')">Major Arcana</button>
    <button class="deck-option suit-fire"  data-deck="fire"  onclick="App.setMode('fire')">🔥 Fire</button>
    <button class="deck-option suit-water" data-deck="water" onclick="App.setMode('water')">🌊 Water</button>
    <button class="deck-option suit-earth" data-deck="earth" onclick="App.setMode('earth')">🜃 Earth</button>
    <button class="deck-option suit-air"   data-deck="air"   onclick="App.setMode('air')">💨 Air</button>
    <button class="deck-option"            data-deck="full"  onclick="App.setMode('full')">Full Deck</button>
  </div>

  <!-- Buttons -->
  <div class="button-row">
    <button class="btn-reveal" id="revealBtn" onclick="App.reveal()">▸ Reveal</button>
    <button class="btn-new" onclick="App.reset()">New Reading</button>
  </div>

  <!-- Card spread -->
  <div class="spread" id="spread">
    <div class="card-slot" id="slotPast">
      <div class="card-inner" id="cardPast">
        <div class="card-face card-back">
          <div class="card-back-design">
            <div class="card-back-sigil">🜏</div>
            <div class="card-back-text">Past</div>
          </div>
        </div>
        <div class="card-face card-front" id="frontPast"></div>
      </div>
    </div>

    <div class="card-slot" id="slotPresent">
      <div class="card-inner" id="cardPresent">
        <div class="card-face card-back">
          <div class="card-back-design">
            <div class="card-back-sigil">🜏</div>
            <div class="card-back-text">Present</div>
          </div>
        </div>
        <div class="card-face card-front" id="frontPresent"></div>
      </div>
    </div>

    <div class="card-slot" id="slotFuture">
      <div class="card-inner" id="cardFuture">
        <div class="card-face card-back">
          <div class="card-back-design">
            <div class="card-back-sigil">🜏</div>
            <div class="card-back-text">Future</div>
          </div>
        </div>
        <div class="card-face card-front" id="frontFuture"></div>
      </div>
    </div>
  </div>

  <!-- Reading result -->
  <div class="reading-area" id="readingArea"></div>

  <!-- Gaia stats -->
  <div class="gaia-stats" id="gaiaStats"></div>

</div>

<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<!-- DivineDB -->
<script src="js/supabase.js"></script>

<!-- Astronomy -->
<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.8/astronomy.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.min.js"></script>

<!-- Core modules -->
<script src="js/observe.js"></script>
<script src="js/weight.js"></script>
<script src="js/divine.js"></script>
<script src="js/deal.js"></script>

<!-- ── MOSAIC + PONTUS ── -->
<script>
const MAJOR_ARCANA = [
  {id:"major_00",name:"The Fool",image:"data/images/dionysus-card.jpg"},
  {id:"major_01",name:"The Magician",image:"data/images/major/magician.png"},
  {id:"major_02",name:"The High Priestess",image:"data/images/hera-card.jpg"},
  {id:"major_03",name:"The Empress",image:"data/images/demeter-card.jpg"},
  {id:"major_04",name:"The Emperor",image:"data/images/zeus-card.jpg"},
  {id:"major_05",name:"The Hierophant",image:"data/images/ares-card.jpg"},
  {id:"major_06",name:"The Lovers",image:"data/images/aphrodite-card.jpg"},
  {id:"major_07",name:"The Chariot",image:"data/images/artemis-card.jpg"},
  {id:"major_08",name:"Justice",image:"data/images/athena-card.jpg"},
  {id:"major_09",name:"The Hermit",image:"data/images/hermit-card.jpg"},
  {id:"major_10",name:"Wheel of Fortune",image:"data/images/major/wheel_of_fortune.png"},
  {id:"major_11",name:"Strength",image:"data/images/hephaestus-card.jpg"},
  {id:"major_12",name:"The Hanged Man",image:"data/images/prometheus-card.jpg"},
  {id:"major_13",name:"Death",image:"data/images/thanatos-card.jpg"},
  {id:"major_14",name:"Temperance",image:"data/images/major/temperance.png"},
  {id:"major_15",name:"The Devil",image:"data/images/hades-card.jpg"},
  {id:"major_16",name:"The Tower",image:"data/images/poseidon-card.jpg"},
  {id:"major_17",name:"The Star",image:"data/images/persephone-card.jpg"},
  {id:"major_18",name:"The Moon",image:"data/images/major/moon.png"},
  {id:"major_19",name:"The Sun",image:"data/images/major/sun.png"},
  {id:"major_20",name:"Judgement",image:"data/images/major/judgment.png"},
  {id:"major_21",name:"The World",image:"data/images/major/world.png"}
];
const MINOR_CARDS = [
  {id:"fire_ace",name:"Ace of Fire",image:"data/images/minor/fire/fire_ace.png"},
  {id:"fire_02",name:"Two of Fire",image:"data/images/minor/fire/fire_02.png"},
  {id:"fire_03",name:"Three of Fire",image:"data/images/minor/fire/fire_03.png"},
  {id:"fire_04",name:"Four of Fire",image:"data/images/minor/fire/fire_04.png"},
  {id:"fire_05",name:"Five of Fire",image:"data/images/minor/fire/fire_05.png"},
  {id:"fire_06",name:"Six of Fire",image:"data/images/minor/fire/fire_06.png"},
  {id:"earth_ace",name:"Ace of Earth",image:"data/images/minor/earth/earth_ace.png"},
  {id:"earth_02",name:"Two of Earth",image:"data/images/minor/earth/earth_02.png"},
  {id:"earth_03",name:"Three of Earth",image:"data/images/minor/earth/earth_03.png"},
  {id:"earth_04",name:"Four of Earth",image:"data/images/minor/earth/earth_04.png"},
  {id:"water_ace",name:"Ace of Water",image:"data/images/minor/water/water_ace.png"},
  {id:"water_02",name:"Two of Water",image:"data/images/minor/water/water_02.png"},
  {id:"air_ace",name:"Ace of Air",image:"data/images/minor/air/air_ace.png"}
];

const MOSAIC_POOL = [...MAJOR_ARCANA, ...MAJOR_ARCANA, ...MAJOR_ARCANA, ...MINOR_CARDS];

function buildMosaic() {
  const mosaic = document.getElementById('cardMosaic');
  const cells = [];
  for (let i = 0; i < 36; i++) {
    const card = MOSAIC_POOL[Math.floor(Math.random() * MOSAIC_POOL.length)];
    cells.push(`<img src="${card.image}" alt="" loading="lazy" onerror="this.style.opacity='0'">`);
  }
  mosaic.innerHTML = cells.join('');
}
buildMosaic();

setInterval(() => {
  const imgs = document.querySelectorAll('#cardMosaic img');
  if (imgs.length === 0) return;
  const idx = Math.floor(Math.random() * imgs.length);
  imgs[idx].src = MOSAIC_POOL[Math.floor(Math.random() * MOSAIC_POOL.length)].image;
}, 8000);

// ── Pontus ambient ──
const pCvs = document.getElementById('pontusAmbient');
const pCtx = pCvs.getContext('2d');

function resizePontus() {
  pCvs.width  = window.innerWidth;
  pCvs.height = window.innerHeight;
}
window.addEventListener('resize', resizePontus);
resizePontus();

const TITANS   = ['Oceanus','Tethys','Pontus','Nereus','Doris','Thaumas','Phorcys','Ceto'];
const pOffsets = TITANS.map(() => Math.random() * Math.PI * 2);

function drawPontus() {
  const W = pCvs.width, H = pCvs.height;
  pCtx.clearRect(0, 0, W, H);
  for (let d = TITANS.length - 1; d >= 0; d--) {
    pOffsets[d] += 0.008 * (0.6 + d * 0.07);
    const baseY = H * 0.25 + (d * (H * 0.095));
    const amp   = 5 + d * 1.4;
    const freq  = 0.012 + d * 0.002;
    const b     = 35 + d * 10;
    pCtx.beginPath();
    pCtx.moveTo(0, H);
    for (let x = 0; x <= W; x += 4) {
      const y = baseY
        + Math.sin(x * freq + pOffsets[d]) * amp
        + Math.sin(x * freq * 2.3 + pOffsets[d] * 0.7) * (amp * 0.28);
      pCtx.lineTo(x, y);
    }
    pCtx.lineTo(W, H);
    pCtx.closePath();
    pCtx.fillStyle = `rgba(${14 + d * 3},${48 + b},${140 + d * 8},${0.16 + d * 0.03})`;
    pCtx.fill();
  }
  requestAnimationFrame(drawPontus);
}
drawPontus();
</script>

<!-- ── APP CONTROLLER ── -->
<script>
const App = (() => {
  let mode = 'major';
  let currentReading = null;

  const SIGNS = ['Aries','Taurus','Gemini','Cancer','Leo','Virgo','Libra','Scorpio','Sagittarius','Capricorn','Aquarius','Pisces'];
  const SIGN_GLYPHS = {'Aries':'♈','Taurus':'♉','Gemini':'♊','Cancer':'♋','Leo':'♌','Virgo':'♍','Libra':'♎','Scorpio':'♏','Sagittarius':'♐','Capricorn':'♑','Aquarius':'♒','Pisces':'♓'};

  async function init() {
    // Populate sign selector
    const sel = document.getElementById('birthSign');
    SIGNS.forEach(sign => {
      const o = document.createElement('option');
      o.value = sign;
      o.textContent = `${SIGN_GLYPHS[sign]} ${sign}`;
      sel.appendChild(o);
    });

    updateSkyBadge();
    updateDBStatus();
    updateGaiaStats();
    
    try { await Divine.loadDecks(); } catch(e) { console.warn('Deck preload failed:', e.message); }
  }

  function updateSkyBadge() {
    const badge = document.getElementById('skyBadge');
    try {
      const period     = Observe.getCurrentPeriod();
      const moonAspect = Observe.getMoonAspect();
      const dotClass   = period === 'SUN' ? 'sun' : 'moon';
      const label      = period === 'SUN' ? 'Solar Reading' : 'Lunar Reading';
      badge.innerHTML  = `<span class="period-dot ${dotClass}"></span> ${label} · Moon: ${moonAspect}`;
    } catch(e) {
      badge.innerHTML = 'Sky unavailable · offline reading';
    }
  }

  function updateDBStatus() {
    const el = document.getElementById('dbStatus');
    if (typeof Gaia !== 'undefined' && Gaia.isConnected) {
      el.className = 'db-status connected';
      el.textContent = '📖 Connected to DivineDB';
    } else {
      el.className = 'db-status offline';
      el.textContent = '💾 Offline — readings saved locally';
    }
  }

  async function updateGaiaStats() {
    const el = document.getElementById('gaiaStats');
    try {
      if (typeof Gaia !== 'undefined' && Gaia.isConnected) {
        const stats = await Gaia.getStats();
        if (stats) {
          el.textContent = `📖 ${stats.totalReadings || 0} readings in DivineDB`;
          return;
        }
      }
      el.textContent = '';
    } catch(e) {
      el.textContent = '';
    }
  }

  function setMode(newMode) {
    mode = newMode;
    document.querySelectorAll('.deck-option').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.deck === mode);
    });
    reset();
  }

  async function reveal() {
    const btn = document.getElementById('revealBtn');
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Shuffling...';

    try {
      await Divine.loadDecks();

      const question  = document.getElementById('questionInput').value.trim() || null;
      const birthSign = document.getElementById('birthSign').value || null;

      const pool = mode === 'major' ? Divine.getMajorDeck() :
                   ['fire','water','earth','air'].includes(mode) ? 
                     Divine.getMinorDeck().filter(c => c.element && c.element.toLowerCase() === mode) :
                   Divine.getFullDeck();

      if (pool.length === 0) throw new Error('No cards in selected deck');

      // Draw past and present
      const [past, present] = Divine.uniformDraw(pool, 2);

      // Use Deal.perform for weighted future draw + DivineDB save
      let future, savedToCloud = false;
      
      try {
        const result = await Deal.perform(past.id, present.id, question);
        currentReading = result;
        future = {
          ...pool.find(c => c.id === result.cards.future.id) || result.cards.future,
          isReversed: result.cards.future.isReversed,
          meaning: result.cards.future.meaning
        };
        savedToCloud = result.savedToCloud || false;
      } catch(e) {
        console.warn('Deal.perform failed, using uniform draw:', e.message);
        const futurePool = pool.filter(c => c.id !== past.id && c.id !== present.id);
        const [uniformFuture] = Divine.uniformDraw(futurePool.length > 0 ? futurePool : pool, 1);
        future = uniformFuture;
        currentReading = {
          cards: { past, present, future },
          question: question || 'The unspoken question',
          skyContext: {},
          savedToCloud: false
        };
      }

      // Render cards
      document.getElementById('frontPast').innerHTML    = Divine.renderCard(past,    'past');
      document.getElementById('frontPresent').innerHTML = Divine.renderCard(present, 'present');
      document.getElementById('frontFuture').innerHTML  = Divine.renderCard(future,  'future');

      const cardPast    = document.getElementById('cardPast');
      const cardPresent = document.getElementById('cardPresent');
      const cardFuture  = document.getElementById('cardFuture');

      cardPast.classList.remove('flipped');
      cardPresent.classList.remove('flipped');
      cardFuture.classList.remove('flipped');
      void cardPast.offsetWidth;

      setTimeout(() => cardPast.classList.add('flipped'),    100);
      setTimeout(() => cardPresent.classList.add('flipped'), 400);
      setTimeout(() => cardFuture.classList.add('flipped'),  700);

      setTimeout(() => {
        renderReadingResult(currentReading, savedToCloud);
        btn.textContent = originalText;
        btn.disabled = false;
        updateGaiaStats();
      }, 1200);

    } catch(err) {
      console.error('Reveal failed:', err);
      btn.textContent = 'Error — Try Again';
      btn.disabled = false;
    }
  }

  function renderReadingResult(reading, savedToCloud) {
    const area = document.getElementById('readingArea');
    const past    = reading.cards.past;
    const present = reading.cards.present;
    const future  = reading.cards.future;
    const sky     = reading.skyContext || {};
    const question = reading.question || 'The unspoken question';

    let html = '';

    // Header
    html += `<div class="reading-header">✦ The Reading ✦</div>`;

    // Sky context
    if (sky.sunIn || sky.moonIn) {
      html += `<div class="reading-sky">
        ☀️ ${sky.sunIn || '?'} · 🌙 ${sky.moonIn || '?'} 
        ${sky.moonPhase ? '(' + sky.moonPhase + ')' : ''}
      </div>`;
    }

    // Question
    html += `<div style="text-align:center;font-style:italic;color:var(--text-dim);margin-bottom:20px;font-size:14px;">
      Asked: "${question}"
    </div>`;

    // Card meanings
    [{pos:'past', card:past}, {pos:'present', card:present}, {pos:'future', card:future}].forEach(({pos, card}) => {
      const meaning = card.meaning || card.upright || card.reversed || '';
      const reversedMark = card.isReversed ? ' ⥮ Reversed' : '';
      html += `<div class="reading-block">
        <div class="reading-position">${pos} · ${card.name}${reversedMark}</div>
        <div class="reading-text">${meaning || 'The meaning unfolds in time.'}</div>
      </div>`;
    });

    // Synthesis (if Deal returned one)
    if (reading.synthesis) {
      html += `<div class="reading-synthesis">${reading.synthesis.synthesis || reading.synthesis}</div>`;
    }

    // Saved indicator
    html += `<div class="saved-indicator ${savedToCloud ? 'cloud' : ''}">
      ${savedToCloud ? '📖 Saved to DivineDB' : '💾 Saved locally'}
      ${reading.savedId ? ' · ID: ' + reading.savedId : ''}
    </div>`;

    area.innerHTML = html;
    area.classList.add('visible');
    area.scrollIntoView({ behavior: 'smooth' });
  }

  function reset() {
    currentReading = null;
    ['cardPast','cardPresent','cardFuture'].forEach(id => {
      document.getElementById(id).classList.remove('flipped');
    });
    document.getElementById('readingArea').classList.remove('visible');
    document.getElementById('readingArea').innerHTML = '';
    document.getElementById('revealBtn').disabled = false;
    document.getElementById('revealBtn').textContent = '▸ Reveal';
    setTimeout(() => {
      ['frontPast','frontPresent','frontFuture'].forEach(id => {
        document.getElementById(id).innerHTML = '';
      });
    }, 400);
  }

  return { init, reveal, reset, setMode };
})();

document.addEventListener('DOMContentLoaded', () => App.init());
</script>
