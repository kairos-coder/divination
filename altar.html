<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Altar · Digital Divination</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    :root {
      --bg-void: #060610; --bg-deep: #0c0c1e;
      --gold: #d4a840; --gold-light: #f0d878; --gold-dark: #8a6518;
      --text: #f0ead8; --text-dim: #988870;
      --card-border: rgba(212,168,64,0.3);
      --inscription-color: #988870; --inscription-em: #d4a840;
      --god-color: transparent;
    }

    body {
      background: var(--bg-void);
      background-image:
        radial-gradient(ellipse 70% 50% at 10% 5%, #120828 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 90% 95%, #081420 0%, transparent 55%);
      font-family: 'Cormorant Garamond', Georgia, serif;
      color: var(--text); min-height: 100vh; overflow-x: hidden;
    }
    body::after {
      content:''; position:fixed; inset:0;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.65) 100%);
      pointer-events:none; z-index:1;
    }

    #cardMosaic {
      position:fixed; inset:0; z-index:0; pointer-events:none;
      display:grid; grid-template-columns:repeat(6,1fr); opacity:0.12;
    }
    #cardMosaic img {
      width:100%; aspect-ratio:2/3; object-fit:cover;
      filter:sepia(0.15) brightness(0.85);
    }
    #cardMosaic::after {
      content:''; position:fixed; inset:0;
      background: var(--god-color, transparent);
      opacity:0.08; mix-blend-mode:color;
      pointer-events:none; z-index:1; transition:background 0.8s, opacity 0.8s;
    }
    @media(max-width:600px){ #cardMosaic{grid-template-columns:repeat(3,1fr);opacity:0.08} }

    #altar-root {
      position:relative; z-index:3;
      display:flex; flex-direction:column; align-items:center;
      justify-content:center; min-height:100vh; padding:2rem 1rem;
    }

    /* ── NAV ── */
    .am-nav {
      position:fixed; top:0; left:0; right:0; height:56px;
      background:rgba(8,8,20,0.9); backdrop-filter:blur(20px);
      border-bottom:1px solid rgba(212,168,64,0.2);
      display:flex; align-items:center; justify-content:space-between;
      padding:0 48px; z-index:200;
    }
    .am-nav-brand-title{font-family:'Cinzel Decorative',serif;font-size:13px;color:var(--gold);letter-spacing:1.5px}
    .am-nav-brand-sub{font-family:'Cinzel',serif;font-size:7px;letter-spacing:5px;color:var(--gold-dark);text-transform:uppercase}
    .am-nav-links{display:flex;gap:24px;list-style:none}
    .am-nav-links a{font-family:'Cinzel',serif;font-size:8px;letter-spacing:3px;text-transform:uppercase;color:var(--text-dim);text-decoration:none;transition:color 0.2s}
    .am-nav-links a:hover{color:var(--gold-light)}
    @media(max-width:600px){.am-nav{padding:0 20px}.am-nav-links{gap:12px}}

    /* ── HEADER ── */
    .am-eyebrow{font-family:'Cinzel',serif;font-size:9px;letter-spacing:8px;text-transform:uppercase;color:var(--gold);opacity:0.5;margin-bottom:8px;text-align:center;margin-top:56px}
    .am-title{font-family:'Cinzel Decorative',serif;font-size:clamp(24px,5vw,44px);font-weight:900;color:var(--gold-light);text-shadow:0 0 80px rgba(212,168,64,0.2),0 4px 16px rgba(0,0,0,0.9);letter-spacing:3px;text-align:center;margin-bottom:1rem}

    /* ── ALTAR COMPOSITION ── */
    .altar-composition{
      position:relative; width:100%; max-width:700px;
      display:flex; flex-direction:column; align-items:center;
    }

    /* ── WIZARD ── */
    .wizard-container{
      position:absolute; top:-20px; right:20px; z-index:10;
      width:100px; height:140px;
      border:2px solid rgba(212,168,64,0.25); border-radius:4px; overflow:hidden;
      box-shadow:0 0 30px rgba(0,0,0,0.4);
      transition:border-color 0.6s;
      animation: floatWizard 4s ease-in-out infinite;
    }
    .wizard-container img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(0.8) sepia(0.15)}
    @keyframes floatWizard{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-8px)}
    }

    /* ── SHRINE CARD ── */
    .shrine-card-wrap{position:relative;display:flex;align-items:center;margin-bottom:0.5rem;z-index:5}
    .shrine-card{
      position:relative;width:240px;height:360px;margin:0 auto;
      border:3px solid var(--card-border);border-radius:6px;overflow:hidden;
      box-shadow:0 0 60px rgba(0,0,0,0.5),0 0 0 1px rgba(212,168,64,0.1);
      cursor:pointer;transition:border-color 0.6s,box-shadow 0.6s;
    }
    .shrine-card:hover{border-color:var(--gold);box-shadow:0 0 70px rgba(0,0,0,0.6),0 0 30px rgba(212,168,64,0.15)}
    .shrine-card img{width:100%;height:100%;object-fit:cover;display:block}
    .shrine-nav{
      position:absolute;top:50%;transform:translateY(-50%);font-size:1.4rem;
      color:var(--gold);cursor:pointer;z-index:5;opacity:0.5;transition:opacity 0.2s;
      background:rgba(0,0,0,0.5);width:32px;height:48px;
      display:flex;align-items:center;justify-content:center;
    }
    .shrine-nav:hover{opacity:1}
    .shrine-nav.prev{left:-40px;border-radius:4px 0 0 4px}
    .shrine-nav.next{right:-40px;border-radius:0 4px 4px 0}
    .card-name-label{text-align:center;font-family:'Cinzel',serif;font-size:0.6rem;letter-spacing:0.2em;color:var(--gold);margin-bottom:0.8rem;text-transform:uppercase;transition:color 0.6s}

    /* ── VANITAS ── */
    .vanitas-container{
      width:100%; max-width:500px; margin-bottom:0.8rem; z-index:3;
      border:2px solid rgba(212,168,64,0.15); border-radius:4px; overflow:hidden;
      box-shadow:0 0 40px rgba(0,0,0,0.4);
    }
    .vanitas-container img{
      width:100%; height:auto; max-height:200px; object-fit:cover; display:block;
      filter:sepia(0.2) brightness(0.6);
      transition:filter 0.6s;
    }

    /* ── ATTENDANTS ── */
    .attendants-row{
      display:flex; gap:1rem; justify-content:center; margin-bottom:0.8rem;
      flex-wrap:wrap; z-index:3;
    }
    .attendant-card{
      width:100px; height:150px;
      border:2px solid rgba(212,168,64,0.2); border-radius:4px; overflow:hidden;
      box-shadow:0 0 25px rgba(0,0,0,0.35);
      cursor:pointer; transition:border-color 0.6s,transform 0.2s;
    }
    .attendant-card:hover{border-color:var(--gold);transform:translateY(-4px)}
    .attendant-card img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(0.8)}
    .attendant-name{
      text-align:center; font-family:'Cinzel',serif; font-size:0.4rem;
      letter-spacing:0.1em; color:var(--text-dim); margin-top:0.2rem;
    }

    /* ── INSCRIPTION ── */
    .altar-rule{width:420px;max-width:80vw;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0.8rem auto;opacity:0.2}
    .altar-inscription{text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(14px,2.5vw,18px);color:var(--inscription-color);letter-spacing:0.04em;line-height:1.8;margin-bottom:0.3rem;transition:color 0.6s}
    .altar-inscription em{color:var(--inscription-em);font-style:normal;text-shadow:0 0 20px rgba(212,168,64,0.2);transition:color 0.6s,text-shadow 0.6s}
    .altar-keywords{text-align:center;font-family:'Cinzel',serif;font-size:0.5rem;letter-spacing:0.15em;color:var(--inscription-em);text-transform:uppercase;margin-bottom:0.8rem;transition:color 0.6s}

    /* ── BUTTONS ── */
    .altar-cta{display:inline-block;font-family:'Cinzel',serif;font-size:12px;letter-spacing:4px;text-transform:uppercase;color:#0a0a0a;background:linear-gradient(135deg,var(--gold),var(--gold-light));border:none;padding:14px 44px;border-radius:8px;cursor:pointer;transition:all 0.3s;box-shadow:0 0 40px rgba(212,168,64,0.2)}
    .altar-cta:hover{box-shadow:0 0 60px rgba(212,168,64,0.4);transform:translateY(-2px)}
    .altar-scroll-cue{margin-top:1rem;font-family:'Cinzel',serif;font-size:7px;letter-spacing:5px;text-transform:uppercase;color:var(--text-dim);opacity:0.4}

    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .anim-fade{animation:fadeIn 0.6s ease}

    @media(max-width:600px){
      .shrine-card{width:180px;height:270px}
      .shrine-nav.prev{left:-20px}.shrine-nav.next{right:-20px}
      .wizard-container{width:70px;height:100px;top:-10px;right:5px}
      .attendant-card{width:75px;height:112px}
      .attendants-row{gap:0.5rem}
      .vanitas-container img{max-height:140px}
    }
  </style>
</head>
<body>

  <div id="cardMosaic"></div>
  <div id="altar-root"></div>

  <script src="js/altar-draw.js"></script>
  <script>
  // ═══════════════════════════════════
  // CARD MOSAIC BACKGROUND
  // ═══════════════════════════════════

  const MOSAIC_IMAGES = [
    "data/images/dionysus-card.jpg","data/images/major/magician.png",
    "data/images/hera-card.jpg","data/images/demeter-card.jpg",
    "data/images/zeus-card.jpg","data/images/ares-card.jpg",
    "data/images/aphrodite-card.jpg","data/images/artemis-card.jpg",
    "data/images/athena-card.jpg","data/images/hermit-card.jpg",
    "data/images/major/wheel_of_fortune.png","data/images/hephaestus-card.jpg",
    "data/images/prometheus-card.jpg","data/images/thanatos-card.jpg",
    "data/images/major/temperance.png","data/images/hades-card.jpg",
    "data/images/poseidon-card.jpg","data/images/persephone-card.jpg",
    "data/images/major/moon.png","data/images/major/sun.png",
    "data/images/major/judgment.png","data/images/major/world.png",
    "data/images/anubis-card.jpg","data/images/isis-card.jpg",
    "data/images/ra-card.jpg","data/images/thoth-card.jpg",
    "data/images/minor/fire/fire_ace.png","data/images/minor/earth/earth_ace.png",
    "data/images/minor/water/water_ace.png","data/images/minor/air/air_ace.png"
  ];

  function buildMosaic(){const m=document.getElementById('cardMosaic');let h='';for(let i=0;i<36;i++){const img=MOSAIC_IMAGES[Math.floor(Math.random()*MOSAIC_IMAGES.length)];h+=`<img src="${img}" alt="" loading="lazy" onerror="this.style.opacity='0'">`}m.innerHTML=h}
  buildMosaic();
  setInterval(()=>{const imgs=document.querySelectorAll('#cardMosaic img');if(!imgs.length)return;const idx=Math.floor(Math.random()*imgs.length);imgs[idx].style.opacity='0';setTimeout(()=>{imgs[idx].src=MOSAIC_IMAGES[Math.floor(Math.random()*MOSAIC_IMAGES.length)];imgs[idx].style.opacity=''},600)},8000);

  // ═══════════════════════════════════
  // VANITAS POOL
  // ═══════════════════════════════════

  const VANITAS_POOL = [
    'data/images/vanitas0.png',
    'data/images/vanitas1.png',
    'data/images/vanitas2.png',
    'data/images/vanitas-poppy.png'
  ];

  function getRandomVanitas() {
    return VANITAS_POOL[Math.floor(Math.random() * VANITAS_POOL.length)];
  }

  // ═══════════════════════════════════
  // PALETTE
  // ═══════════════════════════════════

  function applyPalette(palette) {
    const root = document.documentElement.style;
    root.setProperty('--card-border', palette.cardBorder);
    root.setProperty('--inscription-color', palette.inscription);
    root.setProperty('--inscription-em', palette.inscriptionEm);
    root.setProperty('--god-color', palette.candle || palette.inscriptionEm);
  }

  // ═══════════════════════════════════
  // RENDER
  // ═══════════════════════════════════

  let currentIndex = 0;

  async function renderAltar(index) {
    const result = await AltarDraw.getCard(index);
    if (!result) return;

    currentIndex = index;
    applyPalette(result.palette);

    const root = document.getElementById('altar-root');
    const vanitasSrc = getRandomVanitas();
    const cardImage = result.card.image;
    const attendants = result.attendants || [];

    root.innerHTML = `
      <nav class="am-nav">
        <div>
          <div class="am-nav-brand-title">Digital Divination</div>
          <div class="am-nav-brand-sub">Aspects of the Divine</div>
        </div>
        <ul class="am-nav-links">
          <li><a href="draw.html">Draw</a></li>
          <li><a href="oracle.html">Oracle</a></li>
          <li><a href="almanac.html">Almanac</a></li>
          <li><a href="celestial.html">☀ Celestial</a></li>
          <li><a href="chthonic.html">⬡ Chthonic</a></li>
          <li><a href="index.html">Home</a></li>
        </ul>
      </nav>

      <p class="am-eyebrow">The Altar</p>
      <h1 class="am-title">Digital Divination</h1>

      <div class="altar-composition anim-fade">

        <!-- WIZARD — upper right -->
        <div class="wizard-container">
          <img src="data/images/wizard.png" alt="The Wizard" loading="lazy" onerror="this.style.opacity='0.2';this.style.background='var(--bg-deep)';">
        </div>

        <!-- SHRINE CARD -->
        <div class="shrine-card-wrap">
          <span class="shrine-nav prev" onclick="cycleCard(-1)">◂</span>
          <div class="shrine-card" onclick="cycleCard(1)">
            <img src="${cardImage}" alt="${result.card.name}" onerror="this.style.opacity='0.3';this.style.background='radial-gradient(circle,var(--bg-deep),var(--bg-void))';">
          </div>
          <span class="shrine-nav next" onclick="cycleCard(1)">▸</span>
        </div>
        <p class="card-name-label">${result.displayName}</p>

        <!-- VANITAS -->
        <div class="vanitas-container">
          <img src="${vanitasSrc}" alt="" loading="lazy" onerror="this.style.opacity='0.15';this.style.background='var(--bg-deep)';">
        </div>

        <!-- ATTENDANTS -->
        ${attendants.length > 0 ? `
        <div class="attendants-row">
          ${attendants.map(a => `
            <div>
              <div class="attendant-card" title="${a.name}${a.title ? ' · ' + a.title : ''}">
                <img src="${a.image}" alt="${a.name}" loading="lazy" onerror="this.style.opacity='0.3';this.style.background='var(--bg-deep)';">
              </div>
              <div class="attendant-name">${a.name}</div>
            </div>
          `).join('')}
        </div>
        ` : ''}

      </div>

      <div class="altar-rule"></div>

      <p class="altar-inscription anim-fade">
        ${(result.reading || 'All things pass into shadow.').split('.')[0]}.<br>
        <em>${result.keywordString || 'What remains is what was true.'}</em>
      </p>
      <p class="altar-keywords">${result.displaySubtitle}</p>

      <button class="altar-cta" onclick="drawNewCard()">🜏 Draw Again</button>
      <p class="altar-scroll-cue">The altar speaks · The shrine transforms</p>
    `;
  }

  // ═══════════════════════════════════
  // ACTIONS
  // ═══════════════════════════════════

  async function drawNewCard() {
    const result = await AltarDraw.draw();
    if (!result) return;
    const deck = await AltarDraw.loadDeck();
    currentIndex = deck.findIndex(c => c.id === result.card.id);
    if (currentIndex < 0) currentIndex = 0;
    renderAltar(currentIndex);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function cycleCard(direction) {
    const size = await AltarDraw.getDeckSize();
    currentIndex = ((currentIndex + direction) % size + size) % size;
    renderAltar(currentIndex);
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') cycleCard(1);
    if (e.key === 'ArrowLeft') cycleCard(-1);
    if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); drawNewCard(); }
  });

  window.drawNewCard = drawNewCard;
  window.cycleCard = cycleCard;

  // ═══════════════════════════════════
  // INIT
  // ═══════════════════════════════════

  async function init() {
    const result = await AltarDraw.draw();
    if (!result) return;
    const deck = await AltarDraw.loadDeck();
    currentIndex = deck.findIndex(c => c.id === result.card.id);
    if (currentIndex < 0) currentIndex = 0;
    renderAltar(currentIndex);
  }

  init();
  </script>
  <script data-goatcounter="https://kairos-coder.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
