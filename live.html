<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Divination · Live Oracle</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #c9a84c; --gold-light: #e8c96a; --gold-dark: #7a5c18;
      --void: #05050d; --surface: #0e0e20; --border-gold: rgba(201,168,76,0.12);
      --text: #ede5d0; --text-dim: #605848;
      --fire: #c94a2a; --water: #3a6a9a;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--void); color: var(--text);
      font-family: 'Cormorant Garamond', serif;
      min-height: 100vh; overflow: hidden;
    }

    /* ── BACKGROUND CAROUSEL ── */
    .bg-carousel {
      position: fixed; inset: 0; z-index: 0;
    }
    .bg-image {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      opacity: 0; transition: opacity 2s ease;
      filter: brightness(0.25) saturate(0.6);
    }
    .bg-image.active { opacity: 1; }

    /* ── OVERLAY ── */
    .overlay {
      position: fixed; inset: 0;
      background: radial-gradient(ellipse 60% 40% at 50% 40%, transparent 0%, rgba(5,5,13,0.7) 100%);
      z-index: 1; pointer-events: none;
    }

    /* ── MAIN LAYOUT ── */
    .stage {
      position: relative; z-index: 10;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2rem;
    }

    /* ── HEADER ── */
    .show-header {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 1rem 2rem; display: flex;
      align-items: center; justify-content: space-between;
      z-index: 20;
      background: linear-gradient(to bottom, rgba(5,5,13,0.9), transparent);
    }
    .show-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: 0.9rem; color: var(--gold-light);
      letter-spacing: 0.2em;
    }
    .show-sub {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.45rem; color: var(--text-dim);
      letter-spacing: 0.15em; text-transform: uppercase;
    }
    .live-badge {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.5rem; color: var(--fire);
      border: 1px solid rgba(201,74,42,0.3); padding: 4px 10px;
    }
    .live-dot {
      display: inline-block; width: 6px; height: 6px;
      border-radius: 50%; background: var(--fire);
      margin-right: 5px; animation: blink 1.2s infinite; vertical-align: middle;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

    /* ── CARD SPREAD ── */
    .spread-container {
      display: flex; gap: 2rem; align-items: center;
      justify-content: center; margin: 2rem 0;
      perspective: 1200px;
    }
    .card-slot {
      width: 200px; aspect-ratio: 2/3;
      position: relative; transform-style: preserve-3d;
    }
    .card-inner {
      width: 100%; height: 100%; position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card-inner.flipped { transform: rotateY(180deg); }
    .card-face {
      position: absolute; inset: 0;
      backface-visibility: hidden; border-radius: 12px;
      overflow: hidden; border: 1px solid rgba(201,168,76,0.2);
    }
    .card-back {
      background: linear-gradient(135deg, #1a1a3a, #0e0e20, #1a1a3a);
      display: flex; align-items: center; justify-content: center;
    }
    .card-back-sigil {
      font-size: 3rem; opacity: 0.5; filter: drop-shadow(0 0 20px rgba(201,168,76,0.3));
    }
    .card-front {
      background: var(--surface); transform: rotateY(180deg);
      display: flex; flex-direction: column;
    }
    .card-front img {
      width: 100%; height: 55%; object-fit: cover;
      border-bottom: 1px solid var(--border-gold);
    }
    .card-front .info {
      flex: 1; padding: 0.6rem 0.8rem;
      display: flex; flex-direction: column; justify-content: center;
    }
    .card-front .pos {
      font-family: 'Cinzel', serif; font-size: 0.5rem;
      letter-spacing: 0.2em; color: var(--gold); text-transform: uppercase;
      opacity: 0.7; margin-bottom: 0.2rem;
    }
    .card-front .name {
      font-family: 'Cinzel Decorative', serif; font-size: 0.75rem;
      color: var(--gold-light); line-height: 1.2;
    }
    .card-front .meaning {
      font-size: 0.55rem; font-style: italic;
      color: var(--text-dim); margin-top: 0.3rem; line-height: 1.4;
    }

    /* ── READING DISPLAY ── */
    .reading-bar {
      text-align: center; max-width: 700px;
      opacity: 0; transition: opacity 0.6s ease;
    }
    .reading-bar.visible { opacity: 1; }
    .reading-synthesis {
      font-size: 1rem; font-style: italic; color: var(--text);
      line-height: 1.6; margin-bottom: 0.5rem;
    }
    .reading-cards {
      font-family: 'Cinzel', serif; font-size: 0.6rem;
      letter-spacing: 0.15em; color: var(--gold);
      text-transform: uppercase;
    }

    /* ── BOTTOM BAR ── */
    .bottom-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 0.8rem 2rem; display: flex;
      align-items: center; justify-content: space-between;
      z-index: 20;
      background: linear-gradient(to top, rgba(5,5,13,0.95), transparent);
    }
    .countdown {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.55rem; color: var(--text-dim);
      letter-spacing: 0.1em;
    }
    .countdown span { color: var(--gold); }
    .next-draw {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.5rem; color: var(--text-dim);
      letter-spacing: 0.1em;
    }
    .next-draw span { color: var(--fire); }
    .suit-badge {
      font-family: 'Cinzel', serif; font-size: 0.55rem;
      color: var(--fire); letter-spacing: 0.15em;
      border: 1px solid rgba(201,74,42,0.3); padding: 3px 10px;
    }

    /* ── WEBCAM CORNER ── */
    .webcam-corner {
      position: fixed; bottom: 80px; right: 2rem;
      width: 120px; height: 80px; border: 1px solid rgba(201,168,76,0.2);
      z-index: 20; background: var(--surface);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.4rem; color: var(--text-dim);
      letter-spacing: 0.1em;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 700px) {
      .spread-container { gap: 1rem; }
      .card-slot { width: 140px; }
      .card-front .name { font-size: 0.6rem; }
      .card-front .meaning { font-size: 0.45rem; }
    }
  </style>
</head>
<body>

<!-- BACKGROUND CAROUSEL -->
<div class="bg-carousel" id="bgCarousel"></div>
<div class="overlay"></div>

<!-- HEADER -->
<div class="show-header">
  <div>
    <div class="show-title">Digital Divination</div>
    <div class="show-sub">Live Oracle · Fire Deck · @ealdforn</div>
  </div>
  <div class="live-badge"><span class="live-dot"></span>LIVE</div>
</div>

<!-- STAGE -->
<div class="stage">

  <!-- CARD SPREAD -->
  <div class="spread-container" id="spreadContainer">
    <div class="card-slot" id="slotPast">
      <div class="card-inner" id="cardPast">
        <div class="card-face card-back">
          <div class="card-back-sigil">🜏</div>
        </div>
        <div class="card-face card-front" id="frontPast"></div>
      </div>
    </div>
    <div class="card-slot" id="slotPresent">
      <div class="card-inner" id="cardPresent">
        <div class="card-face card-back">
          <div class="card-back-sigil">🜏</div>
        </div>
        <div class="card-face card-front" id="frontPresent"></div>
      </div>
    </div>
    <div class="card-slot" id="slotFuture">
      <div class="card-inner" id="cardFuture">
        <div class="card-face card-back">
          <div class="card-back-sigil">🜏</div>
        </div>
        <div class="card-face card-front" id="frontFuture"></div>
      </div>
    </div>
  </div>

  <!-- READING -->
  <div class="reading-bar" id="readingBar">
    <div class="reading-synthesis" id="readingSynthesis"></div>
    <div class="reading-cards" id="readingCards"></div>
  </div>

</div>

<!-- BOTTOM BAR -->
<div class="bottom-bar">
  <div class="countdown">Reset: <span id="countdownDisplay">--:--:--</span></div>
  <div class="suit-badge">🔥 FIRE DECK</div>
  <div class="next-draw">Next draw: <span id="nextDrawTimer">60</span>s</div>
</div>

<!-- WEBCAM CORNER -->
<div class="webcam-corner">BUILDER</div>

<script>
  // ═══════════════════════════════════════════
  // DIGITAL DIVINATION · LIVE ORACLE DASHBOARD
  // ═══════════════════════════════════════════

  // ── BACKGROUND IMAGES ──────────────────────────────────────────────
  const BG_IMAGES = [
    'data/images/minor/fire/fire_ace.png',
    'data/images/minor/fire/fire_02.png',
    'data/images/minor/fire/fire_03.png',
    'data/images/minor/fire/fire_04.png',
    'data/images/minor/fire/fire_05.png',
    'data/images/minor/fire/fire_06.png',
    'data/images/minor/fire/fire_07.png',
    'data/images/minor/fire/fire_08.png',
    'data/images/minor/fire/fire_09.png',
    'data/images/minor/fire/fire_10.png',
    'data/images/minor/fire/fire_page.png',
    'data/images/minor/fire/fire_knight.png',
    'data/images/minor/fire/fire_queen.png',
    'data/images/minor/fire/fire_king.png',
    'data/images/dionysus-card.jpg',
    'data/images/zeus-card.jpg',
    'data/images/athena-card.jpg',
    'data/images/aphrodite-card.jpg',
    'data/images/ares-card.jpg',
    'data/images/hades-card.jpg',
    'data/images/persephone-card.jpg',
    'data/images/thanatos-card.jpg',
  ];

  let bgIndex = 0;
  function buildCarousel() {
    const container = document.getElementById('bgCarousel');
    BG_IMAGES.forEach((src, i) => {
      const div = document.createElement('div');
      div.className = 'bg-image' + (i === 0 ? ' active' : '');
      div.style.backgroundImage = `url(${src})`;
      container.appendChild(div);
    });
  }

  function rotateBackground() {
    const images = document.querySelectorAll('.bg-image');
    if (images.length === 0) return;
    images[bgIndex].classList.remove('active');
    bgIndex = (bgIndex + 1) % images.length;
    images[bgIndex].classList.add('active');
  }

  // ── FIRE DECK ──────────────────────────────────────────────────────
  const FIRE_DECK = [
    { id:'fire_ace', name:'Ace of Fire', title:'Maui', meaning:'Maui stole fire from the underworld. The divine spark — the idea that costs everything to bring down. Create. But know the price.', image:'data/images/minor/fire/fire_ace.png', element:'Fire' },
    { id:'fire_02', name:'Two of Fire', title:'Castor & Pollux', meaning:'Two flames burn as one — one mortal, one divine. The partnership that transcends difference. One of you will carry the other.', image:'data/images/minor/fire/fire_02.png', element:'Fire' },
    { id:'fire_03', name:'Three of Fire', title:'Peitho', meaning:'The room leans in. Peitho, goddess of persuasion, speaks and the world bends toward her words. The pitch. Speak. They are listening.', image:'data/images/minor/fire/fire_03.png', element:'Fire' },
    { id:'fire_04', name:'Four of Fire', title:'Icarus', meaning:'The wax melts. Icarus plummets. The burnout — when ambition exceeds capacity. The fall is not failure. It is proof you flew.', image:'data/images/minor/fire/fire_04.png', element:'Fire' },
    { id:'fire_05', name:'Five of Fire', title:'Loki', meaning:'Loki spoke back to the gods, exposing every secret. The ugliest truth-teller in Asgard — and sometimes the only honest one. Who is criticizing you, and why?', image:'data/images/minor/fire/fire_05.png', element:'Fire' },
    { id:'fire_06', name:'Six of Fire', title:'The Algorithm', meaning:'The Algorithm amplifies your name until it belongs to everyone but you. The viral moment. Ride it. Don\'t believe it. The Algorithm has no loyalty.', image:'data/images/minor/fire/fire_06.png', element:'Fire' },
    { id:'fire_07', name:'Seven of Fire', title:'Talos', meaning:'Talos patrols the shores — a bronze giant, unstoppable, doing what it was built to do. The system that shapes you without consent. Learn the code.', image:'data/images/minor/fire/fire_07.png', element:'Fire' },
    { id:'fire_08', name:'Eight of Fire', title:'Huitzilopochtli', meaning:'The hummingbird warrior demanded constant sacrifice to keep the sun moving. The ceaseless grind. The push IS the purpose. But ask: who is being sacrificed?', image:'data/images/minor/fire/fire_08.png', element:'Fire' },
    { id:'fire_09', name:'Nine of Fire', title:'Cerberus', meaning:'Three heads. One gate. Cerberus guards the entrance — nothing passes without consent. The gatekeeper. Prove yourself worthy of passage.', image:'data/images/minor/fire/fire_09.png', element:'Fire' },
    { id:'fire_10', name:'Ten of Fire', title:'Surtr', meaning:'Surtr rides out of Muspelheim, his sword brighter than the sun, and burns the world. The spectacular exit. Not all endings are graceful. Some are mythic.', image:'data/images/minor/fire/fire_10.png', element:'Fire' },
    { id:'fire_page', name:'Page of Fire', title:'Agni', meaning:'Agni, the fire god, carries offerings from mortals to the gods. The youngest flame. The beginner who bridges realms. You are new here. That is your power.', image:'data/images/minor/fire/fire_page.png', element:'Fire' },
    { id:'fire_knight', name:'Knight of Fire', title:'Achilles', meaning:'Achilles charges and the Trojans break. Conviction as armor — the warrior who cannot be stopped. Charge. But know your heel.', image:'data/images/minor/fire/fire_knight.png', element:'Fire' },
    { id:'fire_queen', name:'Queen of Fire', title:'Oya', meaning:'Oya, orisha of fire and wind, leads warriors into battle. The sovereign who does not ask permission. She commands the storm. Take your seat.', image:'data/images/minor/fire/fire_queen.png', element:'Fire' },
    { id:'fire_king', name:'King of Fire', title:'The Founder', meaning:'The Founder built the system and now rules from within it. The spark that scaled. The platform is yours. Can you hold it without becoming the monster at the center?', image:'data/images/minor/fire/fire_king.png', element:'Fire' },
  ];

  // ── DRAW ───────────────────────────────────────────────────────────
  function drawFireSpread() {
    const pool = [...FIRE_DECK];
    const drawn = [];
    for (let i = 0; i < 3; i++) {
      const idx = Math.floor(Math.random() * pool.length);
      drawn.push({ ...pool.splice(idx, 1)[0], position: i === 0 ? 'past' : i === 1 ? 'present' : 'future', isReversed: Math.random() < 0.3 });
    }
    return { past: drawn[0], present: drawn[1], future: drawn[2] };
  }

  // ── RENDER CARDS ───────────────────────────────────────────────────
  const POSITIONS = { past: 'Past', present: 'Present', future: 'Future' };

  function renderCard(card, slotId, frontId, cardId) {
    const front = document.getElementById(frontId);
    const reversed = card.isReversed ? ' ⥮ Reversed' : '';
    front.innerHTML = `
      <img src="${card.image}" alt="${card.name}" onerror="this.style.display='none'" />
      <div class="info">
        <div class="pos">${POSITIONS[card.position]}${reversed}</div>
        <div class="name">${card.name}</div>
        <div class="meaning">${card.title} — ${card.meaning.substring(0, 80)}...</div>
      </div>`;
    
    const inner = document.getElementById(cardId);
    inner.classList.remove('flipped');
    void inner.offsetWidth;
    return inner;
  }

  function revealCards(draw) {
    const past = renderCard(draw.past, 'slotPast', 'frontPast', 'cardPast');
    const present = renderCard(draw.present, 'slotPresent', 'frontPresent', 'cardPresent');
    const future = renderCard(draw.future, 'slotFuture', 'frontFuture', 'cardFuture');

    setTimeout(() => past.classList.add('flipped'), 100);
    setTimeout(() => present.classList.add('flipped'), 500);
    setTimeout(() => future.classList.add('flipped'), 900);

    // Show reading
    setTimeout(() => {
      const synthesis = buildSynthesis(draw);
      document.getElementById('readingSynthesis').textContent = synthesis;
      document.getElementById('readingCards').textContent = 
        `${draw.past.name} · ${draw.present.name} · ${draw.future.name}`;
      document.getElementById('readingBar').classList.add('visible');
      
      // Send to Kitten narration
      sendToKitten(draw, synthesis);
    }, 1400);
  }

  function buildSynthesis(draw) {
    const names = `${draw.past.title}, ${draw.present.title}, ${draw.future.title}`;
    const reversedCount = [draw.past, draw.present, draw.future].filter(c => c.isReversed).length;
    let syn = 'The Fire suit speaks with a single voice. ';
    if (reversedCount === 3) syn += 'All three cards reversed — resistance to something fundamental. ';
    else if (reversedCount === 0) syn += 'The cards speak clearly. ';
    else syn += 'Some resistance clouds the path. ';
    syn += `${names} form a triptych. Past, present, future — not separate, but a single image split across time. Read them as one.`;
    return syn;
  }

  function clearCards() {
    ['cardPast','cardPresent','cardFuture'].forEach(id => {
      document.getElementById(id).classList.remove('flipped');
    });
    document.getElementById('readingBar').classList.remove('visible');
    setTimeout(() => {
      ['frontPast','frontPresent','frontFuture'].forEach(id => {
        document.getElementById(id).innerHTML = '';
      });
    }, 400);
  }

  // ── KITTEN INTEGRATION ─────────────────────────────────────────────
  function sendToKitten(draw, synthesis) {
    const text = `Fire deck reading. Past: ${draw.past.title} — ${draw.past.name}. Present: ${draw.present.title} — ${draw.present.name}. Future: ${draw.future.title} — ${draw.future.name}. ${synthesis}`;
    if (window.BroadcastChannel) {
      try {
        new BroadcastChannel('ealdforn_narration').postMessage({ text, source: 'Divination Live', timestamp: Date.now() });
      } catch(e) {}
    }
  }

  // ── AUTO-DRAW CYCLE ────────────────────────────────────────────────
  let drawTimer = 60;
  let cycleInterval;
  let countdownInterval;

  function startAutoDraw() {
    // Draw immediately
    const draw = drawFireSpread();
    revealCards(draw);
    drawTimer = 60;
    updateTimerDisplay();

    // Cycle every 60 seconds
    cycleInterval = setInterval(() => {
      clearCards();
      setTimeout(() => {
        const newDraw = drawFireSpread();
        revealCards(newDraw);
        drawTimer = 60;
        updateTimerDisplay();
      }, 500);
    }, 60000);

    // Countdown ticker
    countdownInterval = setInterval(() => {
      drawTimer--;
      updateTimerDisplay();
    }, 1000);
  }

  function updateTimerDisplay() {
    document.getElementById('nextDrawTimer').textContent = drawTimer;
  }

  // ── COUNTDOWN TO RESET ─────────────────────────────────────────────
  function getNextReset() {
    const now = new Date();
    const reset = new Date();
    reset.setHours(20, 0, 0, 0);
    if (now >= reset) reset.setDate(reset.getDate() + 1);
    return reset.getTime();
  }

  function updateCountdown() {
    const diff = getNextReset() - Date.now();
    if (diff <= 0) {
      document.getElementById('countdownDisplay').textContent = 'RESET';
      return;
    }
    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    document.getElementById('countdownDisplay').textContent = 
      `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  // ── BOOT ───────────────────────────────────────────────────────────
  buildCarousel();
  setInterval(rotateBackground, 8000); // Rotate background every 8s
  updateCountdown();
  setInterval(updateCountdown, 1000);
  startAutoDraw();

  console.log('🜏 Digital Divination · Live Oracle Dashboard ready.');
  console.log('   Auto-draw: Every 60 seconds');
  console.log('   Background: 22 images rotating every 8s');
  console.log('   Deck: Fire suit (14 cards)');
  console.log('   Kitten: BroadcastChannel → narration.html');
</script>
</body>
</html>
