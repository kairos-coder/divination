<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zodiac · Celestial Grimoire — Digital Divination</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gold:         #d4a840;
  --gold-light:   #f0d878;
  --gold-dark:    #8a6518;
  --void:         #060610;
  --deep:         #0c0c1e;
  --surface:      #181838;
  --surface2:     #202048;
  --border:       #2a2a4a;
  --border-gold:  rgba(212,168,64,0.2);
  --text:         #f0ead8;
  --text-mid:     #d0c0a0;
  --text-dim:     #988870;
  --fire:         #c94a2a;
  --earth:        #6a8a3a;
  --water:        #66aacc;
  --air:          #aa88cc;
  --sage:         #8ab87a;
}

html { scroll-behavior: smooth; }

body {
  background: var(--void);
  background-image:
    radial-gradient(ellipse 70% 50% at 10% 5%, #120828 0%, transparent 55%),
    radial-gradient(ellipse 50% 40% at 90% 95%, #081420 0%, transparent 55%),
    radial-gradient(circle at 50% 50%, #0a0820 0%, var(--void) 100%);
  font-family: 'Cormorant Garamond', Georgia, serif;
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Ambient stars */
.stars {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}
.star {
  position: absolute;
  background: white;
  border-radius: 50%;
  opacity: 0.3;
  animation: twinkle 4s infinite alternate;
}
@keyframes twinkle {
  0% { opacity: 0.08; transform: scale(1); }
  100% { opacity: 0.5; transform: scale(1.3); }
}

nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 56px;
  background: rgba(8,8,20,0.9);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-gold);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  z-index: 200;
}

.nav-brand { display: flex; flex-direction: column; gap: 1px; }
.nav-brand-title { font-family: 'Cinzel Decorative', serif; font-size: 13px; color: var(--gold); letter-spacing: 1.5px; }
.nav-brand-sub { font-family: 'Cinzel', serif; font-size: 7px; letter-spacing: 5px; color: var(--gold-dark); text-transform: uppercase; }

.nav-links { display: flex; gap: 16px; list-style: none; flex-wrap: wrap; }
.nav-links a { font-family: 'Cinzel', serif; font-size: 8px; letter-spacing: 3px; text-transform: uppercase; color: var(--text-dim); text-decoration: none; transition: color 0.2s; padding: 4px 0; }
.nav-links a:hover { color: var(--gold-light); }

.container {
  position: relative;
  z-index: 2;
  max-width: 700px;
  margin: 0 auto;
  padding: 80px 16px 60px;
}

.header {
  text-align: center;
  margin-bottom: 32px;
}
.header h1 {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(24px, 5vw, 40px);
  color: var(--gold-light);
  letter-spacing: 2px;
  text-shadow: 0 0 40px rgba(212,168,64,0.2);
}
.header .date {
  font-family: 'Cinzel', serif;
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--text-dim);
  margin-top: 10px;
}

/* ─── SKY DIAGRAM ─── */
.sky-diagram {
  position: relative;
  width: min(420px, 85vw);
  height: min(420px, 85vw);
  margin: 0 auto 32px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, rgba(12,10,36,0.7), rgba(6,6,18,0.95));
  border: 1px solid var(--border-gold);
  box-shadow: 0 0 80px rgba(0,0,0,0.5), inset 0 0 50px rgba(0,0,0,0.4);
}

.zodiac-ring { position: absolute; inset: 0; border-radius: 50%; }

.zodiac-sign {
  position: absolute;
  text-align: center;
  font-family: 'Cinzel Decorative', serif;
  font-size: 18px;
  color: var(--gold-dim);
  transition: all 0.4s;
  cursor: pointer;
  z-index: 10;
}
.zodiac-sign.active {
  color: var(--gold-light);
  text-shadow: 0 0 12px rgba(212,168,64,0.6);
  font-size: 22px;
}
.zodiac-sign .sign-name {
  font-size: 7px;
  letter-spacing: 2px;
  display: block;
  margin-top: -2px;
  opacity: 0.6;
}
.zodiac-sign.active .sign-name { opacity: 1; }

/* Sign positions around circle */
.sign-0  { top: -8px; left: 50%; transform: translateX(-50%); }
.sign-1  { top: 14%; right: 8%; transform: translate(50%, -50%); }
.sign-2  { top: 50%; right: -8px; transform: translateY(-50%); }
.sign-3  { bottom: 14%; right: 8%; transform: translate(50%, 50%); }
.sign-4  { bottom: -8px; left: 50%; transform: translateX(-50%); }
.sign-5  { bottom: 14%; left: 8%; transform: translate(-50%, 50%); }
.sign-6  { top: 50%; left: -8px; transform: translateY(-50%); }
.sign-7  { top: 14%; left: 8%; transform: translate(-50%, -50%); }
.sign-8  { top: 28%; right: -2px; transform: translate(50%, -50%); }
.sign-9  { bottom: 28%; right: -2px; transform: translate(50%, 50%); }
.sign-10 { bottom: 28%; left: -2px; transform: translate(-50%, 50%); }
.sign-11 { top: 28%; left: -2px; transform: translate(-50%, -50%); }

/* Center */
.center-sky {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  z-index: 5;
}
.center-sky .period-icon {
  font-size: 40px;
  display: block;
}
.center-sky .period-label {
  font-family: 'Cinzel', serif;
  font-size: 7px;
  letter-spacing: 3px;
  color: var(--text-dim);
  margin-top: 6px;
}
.center-sky .moon-phase-name {
  font-size: 10px;
  color: var(--water);
  font-style: italic;
  margin-top: 4px;
}

/* Planet markers */
.planet-marker {
  position: absolute;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  box-shadow: 0 0 6px currentColor;
  z-index: 15;
  transition: transform 0.2s;
}
.planet-marker:active { transform: translate(-50%, -50%) scale(1.4); }
.planet-marker .tooltip {
  position: absolute;
  bottom: 120%;
  left: 50%;
  transform: translateX(-50%);
  background: var(--surface);
  border: 1px solid var(--border-gold);
  border-radius: 6px;
  padding: 3px 8px;
  font-size: 9px;
  white-space: nowrap;
  font-family: 'Cinzel', serif;
  color: var(--text);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}
.planet-marker:active .tooltip { opacity: 1; }

.rune-sun { background: rgba(212,168,64,0.85); color: #1a1a2a; }
.rune-moon { background: rgba(102,170,204,0.85); color: #1a1a2a; }
.rune-mercury { background: rgba(170,136,204,0.85); color: #1a1a2a; }
.rune-venus { background: rgba(240,180,140,0.85); color: #1a1a2a; }
.rune-mars { background: rgba(201,74,42,0.85); color: #1a1a2a; }
.rune-jupiter { background: rgba(138,184,122,0.85); color: #1a1a2a; }
.rune-saturn { background: rgba(140,140,160,0.85); color: #1a1a2a; }

/* ─── GRIMOIRE CARDS ─── */
.grimoire-card {
  background: rgba(24,24,56,0.55);
  backdrop-filter: blur(14px);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px 20px;
  margin-bottom: 20px;
}
.grimoire-card.gold-border { border-color: var(--border-gold); }

.grimoire-card h2 {
  font-family: 'Cinzel Decorative', serif;
  font-size: 15px;
  color: var(--gold-light);
  margin-bottom: 16px;
  letter-spacing: 2px;
  text-align: center;
}

/* Narrative */
.narrative-block {
  font-size: 17px;
  font-style: italic;
  line-height: 1.8;
  color: var(--text-mid);
}
.narrative-block strong { color: var(--gold-light); font-style: normal; }
.narrative-block .sign-addr { color: var(--gold); font-weight: 600; font-style: normal; }
.narrative-block .whisper {
  display: block;
  margin-top: 12px;
  padding-left: 14px;
  border-left: 2px solid rgba(212,168,64,0.2);
  font-size: 15px;
  color: var(--text-dim);
}

.narrative-voice {
  text-align: center;
  font-family: 'Cinzel', serif;
  font-size: 8px;
  letter-spacing: 3px;
  color: var(--gold-dark);
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px solid rgba(212,168,64,0.08);
}

/* Planet grid */
.planet-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px;
  margin-top: 12px;
}
.planet-card {
  background: rgba(0,0,0,0.3);
  border-radius: 10px;
  padding: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: border-color 0.3s;
  border: 1px solid transparent;
}
.planet-card:hover { border-color: var(--border-gold); }
.planet-card .rune {
  width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  font-size: 14px;
  flex-shrink: 0;
}
.planet-card .info { flex: 1; min-width: 0; }
.planet-card .name {
  font-family: 'Cinzel', serif;
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-dim);
}
.planet-card .sign {
  font-family: 'Cinzel Decorative', serif;
  font-size: 14px;
  color: var(--gold-light);
}
.planet-card .degree {
  font-size: 10px;
  color: var(--text-mid);
}

/* Houses list */
.houses-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 8px;
  margin-top: 12px;
}
.house-entry {
  background: rgba(0,0,0,0.25);
  border-radius: 8px;
  padding: 10px;
  text-align: center;
  border: 1px solid transparent;
  transition: all 0.3s;
}
.house-entry.occupied {
  border-color: rgba(212,168,64,0.25);
  background: rgba(20,14,6,0.4);
}
.house-entry .h-glyph {
  font-size: 24px;
  color: var(--gold-dim);
}
.house-entry.occupied .h-glyph { color: var(--gold-light); }
.house-entry .h-name {
  font-family: 'Cinzel', serif;
  font-size: 8px;
  letter-spacing: 1px;
  color: var(--text-dim);
  margin-top: 2px;
}
.house-entry .h-occupant {
  font-size: 9px;
  color: var(--gold);
  font-style: italic;
  margin-top: 2px;
}

/* Sign selector */
.sign-selector {
  text-align: center;
  margin-top: 8px;
  padding-top: 20px;
  border-top: 1px solid var(--border-gold);
}
.sign-selector label {
  font-family: 'Cinzel', serif;
  font-size: 8px;
  letter-spacing: 3px;
  color: var(--text-dim);
  display: block;
  margin-bottom: 8px;
}
.sign-selector select {
  font-family: 'Cinzel', serif;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 11px;
  cursor: pointer;
  text-align: center;
  -webkit-appearance: none;
  appearance: none;
  max-width: 260px;
  width: 100%;
}
.sign-selector select:focus {
  border-color: var(--gold);
  outline: none;
}

#signMessage {
  margin-top: 14px;
  font-size: 14px;
  font-style: italic;
  color: var(--text-mid);
  line-height: 1.6;
  min-height: 40px;
}

/* Refresh button */
.refresh-row {
  text-align: center;
  margin: 16px 0;
}
.btn-refresh {
  font-family: 'Cinzel', serif;
  font-size: 9px;
  letter-spacing: 3px;
  text-transform: uppercase;
  padding: 9px 20px;
  border-radius: 6px;
  border: 1px solid var(--gold-dark);
  background: transparent;
  color: var(--gold);
  cursor: pointer;
  transition: all 0.2s;
}
.btn-refresh:active { background: rgba(212,168,64,0.1); }

footer {
  text-align: center;
  padding: 30px;
  font-size: 7px;
  letter-spacing: 3px;
  color: var(--gold-dark);
  border-top: 1px solid rgba(212,168,64,0.06);
  margin-top: 20px;
  opacity: 0.5;
}

@media (max-width: 600px) {
  nav { padding: 0 12px; }
  .nav-links { gap: 10px; }
  .nav-links a { font-size: 7px; letter-spacing: 2px; }
  .sky-diagram { width: 88vw; height: 88vw; }
  .zodiac-sign { font-size: 14px; }
  .zodiac-sign.active { font-size: 17px; }
  .planet-marker { width: 18px; height: 18px; font-size: 9px; }
  .planet-grid { grid-template-columns: repeat(2, 1fr); }
  .houses-list { grid-template-columns: repeat(3, 1fr); }
}
</style>
</head>

<nav>

<!-- Dependencies -->
<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.8/astronomy.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.min.js"></script>
<script src="js/observe.js"></script>
<script src="js/almanac.js"></script>

<!-- ─── THE MONOLITH ─── -->
<script>
const Grimoire = (() => {
  // ─── CONSTANTS ────────────────────────────
  const SIGNS = Almanac.SIGNS;
  const SIGN_GLYPHS = Almanac.SIGN_GLYPHS;
  const SIGN_NAMES = Almanac.SIGN_NAMES;
  const CELESTIAL = Almanac.CELESTIAL_OLYMPIANS;

  const RUNES = {
    'sun':'☀️','moon':'🌙','mercury':'☿','venus':'♀','mars':'♂',
    'jupiter':'♃','saturn':'♄','uranus':'⛢','neptune':'♆','pluto':'♇'
  };

  const RUNE_CLASS = {
    'sun':'rune-sun','moon':'rune-moon','mercury':'rune-mercury',
    'venus':'rune-venus','mars':'rune-mars','jupiter':'rune-jupiter',
    'saturn':'rune-saturn','uranus':'rune-mercury','neptune':'rune-moon','pluto':'rune-saturn'
  };

  // ─── NARRATIVE VOICES ─────────────────────
  const VOICES = [
    {
      name: 'The Oracle',
      style: 'prophetic',
      generate(planets, period, moonPhase) {
        return buildOracleNarrative(planets, period, moonPhase);
      }
    },
    {
      name: 'The Chronicler',
      style: 'historical',
      generate(planets, period, moonPhase) {
        return buildChroniclerNarrative(planets, period, moonPhase);
      }
    },
    {
      name: 'The Poet',
      style: 'lyrical',
      generate(planets, period, moonPhase) {
        return buildPoetNarrative(planets, period, moonPhase);
      }
    },
    {
      name: 'The Scholar',
      style: 'analytical',
      generate(planets, period, moonPhase) {
        return buildScholarNarrative(planets, period, moonPhase);
      }
    }
  ];

  let currentVoice = null;
  let skyData = null;

  // ─── NARRATIVE BUILDERS ───────────────────
  function buildOracleNarrative(planets, period, moonPhase) {
    const sun = planets.sun;
    const moon = planets.moon;
    const activeSigns = getActiveSigns(planets);
    const emptySigns = SIGNS.filter(s => !activeSigns.includes(s));
    const crowded = activeSigns.filter(s => countPlanetsInSign(planets, s) >= 2);
    
    let text = '';
    
    // Opening proclamation
    if (crowded.length > 0) {
      const sign = crowded[0];
      const count = countPlanetsInSign(planets, sign);
      const gods = getGodsInSign(planets, sign);
      text += `I see <strong>${sign} ${SIGN_GLYPHS[sign]}</strong> — ${count} gods gather here. ${gods.join(' and ')} hold council in the house of ${SIGN_NAMES[sign]}. `;
    } else {
      text += `The stars are scattered tonight. No sign holds more than one watcher. The gods walk alone — each with their own purpose. `;
    }
    
    // Sun prophecy
    if (sun) {
      text += `The Sun burns in <span class="sign-addr">${sun.sign} ${sun.glyph}</span>. Apollo's arrow has been loosed toward the ${SIGN_NAMES[sun.sign]}. `;
    }
    
    // Moon prophecy
    if (moon) {
      const shadowGod = moonPhase?.name?.includes('New') || moonPhase?.name?.includes('Waning Crescent') ? 'Melinoe' : 'Artemis';
      text += `The Moon walks <span class="sign-addr">${moon.sign} ${moon.glyph}</span> as ${shadowGod}. `;
      if (shadowGod === 'Melinoe') {
        text += `The ghosts are restless tonight. What have you buried that still speaks? `;
      }
    }
    
    // Empty houses warning
    if (emptySigns.length >= 6) {
      text += `Half the zodiac stands empty. The gods are concentrated — where they gather, the veil is thin. Where they are absent, you are alone with yourself. `;
    }
    
    // Whisper
    text += `<span class="whisper">${Almanac.getWhisper('Apollo', 1)}</span>`;
    
    return text;
  }

  function buildChroniclerNarrative(planets, period, moonPhase) {
    const sun = planets.sun;
    const moon = planets.moon;
    const activeSigns = getActiveSigns(planets);
    
    let text = '';
    
    // Historical record style
    text += `On this day, the ${getOrdinal(new Date().getDate())} of ${new Date().toLocaleDateString('en-US', { month: 'long' })}, the celestial record shows: `;
    
    if (sun) {
      text += `<strong>Apollo</strong> occupies <span class="sign-addr">${sun.sign}</span> at ${Math.floor(sun.degree)}° — the Sun's chariot rides the ${SIGN_NAMES[sun.sign]}. `;
    }
    
    if (moon) {
      text += `<strong>Artemis</strong> tracks through <span class="sign-addr">${moon.sign}</span> — the huntress stalks the ${SIGN_NAMES[moon.sign]} tonight. `;
    }
    
    // Groupings
    const groupings = activeSigns.filter(s => countPlanetsInSign(planets, s) >= 2);
    groupings.forEach(sign => {
      const count = countPlanetsInSign(planets, sign);
      const gods = getGodsInSign(planets, sign);
      text += `Notably, ${count} watchers — ${gods.join(', ')} — share <span class="sign-addr">${sign}</span>. This configuration last occurred ${getRandomPastDate()}. `;
    });
    
    text += `<span class="whisper">${Almanac.getWhisper('Hermes', 3)}</span>`;
    
    return text;
  }

  function buildPoetNarrative(planets, period, moonPhase) {
    const sun = planets.sun;
    const moon = planets.moon;
    
    let text = '';
    
    if (period === 'SUN') {
      text += `The light spills across <span class="sign-addr">${sun?.sign || 'the sky'}</span> like honey from a jar — slow, golden, inevitable. `;
    } else {
      text += `Darkness wraps the ${SIGN_NAMES[moon?.sign] || 'night'} in velvet. The moon hangs like a pearl in <span class="sign-addr">${moon?.sign || 'the heavens'}</span>. `;
    }
    
    const mars = planets.mars;
    if (mars) {
      text += `Ares sharpens his spear on the whetstone of <span class="sign-addr">${mars.sign}</span>. Even war pauses to admire the stars. `;
    }
    
    const venus = planets.venus;
    if (venus) {
      text += `Aphrodite's mirror reflects <span class="sign-addr">${venus.sign}</span> — beauty recognizes beauty. `;
    }
    
    text += `<span class="whisper">${Almanac.getWhisper('Aphrodite', 5)}</span>`;
    
    return text;
  }

  function buildScholarNarrative(planets, period, moonPhase) {
    const elements = { Fire: 0, Earth: 0, Air: 0, Water: 0 };
    Object.values(planets).forEach(p => {
      if (p) {
        const signIndex = SIGNS.indexOf(p.sign);
        if (signIndex >= 0) {
          const element = ['Fire','Earth','Air','Water'][signIndex % 4];
          elements[element]++;
        }
      }
    });
    
    const dominant = Object.entries(elements).sort((a,b) => b[1]-a[1])[0];
    
    let text = '';
    text += `Elemental analysis reveals <strong>${dominant[0]}</strong> dominance (${dominant[1]} of ${Object.values(planets).filter(p=>p).length} bodies). `;
    
    if (dominant[0] === 'Fire') text += `Action is favored. The cosmos urges movement, decision, ignition. `;
    if (dominant[0] === 'Water') text += `Emotion runs deep. Intuition outweighs logic under this configuration. `;
    if (dominant[0] === 'Earth') text += `Practicality reigns. Material concerns demand attention. Ground yourself. `;
    if (dominant[0] === 'Air') text += `Intellect rises. Communication, thought, and swift change are your allies. `;
    
    text += `<span class="whisper">${Almanac.getWhisper('Athena', 7)}</span>`;
    
    return text;
  }

  // ─── HELPERS ──────────────────────────────
  function getActiveSigns(planets) {
    return [...new Set(Object.values(planets).filter(p => p).map(p => p.sign))];
  }

  function countPlanetsInSign(planets, sign) {
    return Object.values(planets).filter(p => p && p.sign === sign).length;
  }

  function getGodsInSign(planets, sign) {
    return Object.entries(planets)
      .filter(([_, p]) => p && p.sign === sign)
      .map(([name]) => {
        const deity = CELESTIAL[name];
        return deity ? `<strong>${deity.olympian}</strong>` : name;
      });
  }

  function getOrdinal(n) {
    const s = ['th','st','nd','rd'];
    const v = n % 100;
    return n + (s[(v-20)%10] || s[v] || s[0]);
  }

  function getRandomPastDate() {
    const now = new Date();
    const days = Math.floor(Math.random() * 365) + 30;
    const past = new Date(now - days * 86400000);
    return past.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  }

  // ─── BUILD SKY DIAGRAM ────────────────────
  function buildSkyDiagram(planets) {
    // Zodiac ring
    const ring = document.getElementById('zodiacRing');
    ring.innerHTML = SIGNS.map((sign, i) => {
      const active = countPlanetsInSign(planets, sign) > 0;
      return `<div class="zodiac-sign sign-${i} ${active ? 'active' : ''}" data-sign="${sign}">
        ${SIGN_GLYPHS[sign]}<span class="sign-name">${sign.substring(0,3).toUpperCase()}</span>
      </div>`;
    }).join('');

    // Planet markers
    const container = document.getElementById('planetMarkers');
    container.innerHTML = '';
    
    const radius = 38; // percentage
    
    Object.entries(planets).forEach(([name, data]) => {
      if (!data?.sign) return;
      const signIndex = SIGNS.indexOf(data.sign);
      if (signIndex === -1) return;
      
      const angle = (signIndex * 30) + (data.degree / 30 * 30) - 90;
      const rad = (angle * Math.PI) / 180;
      const x = 50 + radius * Math.cos(rad);
      const y = 50 + radius * Math.sin(rad);
      
      const marker = document.createElement('div');
      marker.className = `planet-marker ${RUNE_CLASS[name] || 'rune-sun'}`;
      marker.style.left = `${x}%`;
      marker.style.top = `${y}%`;
      marker.innerHTML = `${RUNES[name] || '✦'}<span class="tooltip">${name.toUpperCase()}</span>`;
      container.appendChild(marker);
    });
  }

  function buildCenterDisplay(period, moonPhase) {
    const center = document.getElementById('centerSky');
    const isSun = period === 'SUN';
    const phaseIcons = ['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'];
    const phaseIdx = moonPhase?.phase ? Math.round(moonPhase.phase * 8) % 8 : 4;
    
    center.innerHTML = `
      <span class="period-icon">${isSun ? '☀️' : phaseIcons[phaseIdx]}</span>
      <div class="period-label">${isSun ? 'SOLAR' : 'LUNAR'} READING</div>
      ${!isSun ? `<div class="moon-phase-name">${moonPhase?.name || ''}</div>` : ''}
    `;
  }

  // ─── BUILD HOUSES ─────────────────────────
  function buildHouses(planets) {
    const grid = document.getElementById('housesList');
    grid.innerHTML = SIGNS.map(sign => {
      const occupants = getGodsInSign(planets, sign);
      const occupied = occupants.length > 0;
      return `
        <div class="house-entry ${occupied ? 'occupied' : ''}">
          <div class="h-glyph">${SIGN_GLYPHS[sign]}</div>
          <div class="h-name">${sign}</div>
          ${occupied ? `<div class="h-occupant">${occupants.join(', ')}</div>` : ''}
        </div>
      `;
    }).join('');
  }

  // ─── BUILD PLANET GRID ────────────────────
  function buildPlanetGrid(planets) {
    const grid = document.getElementById('planetGrid');
    grid.innerHTML = Object.entries(planets)
      .filter(([_, d]) => d)
      .map(([name, data]) => `
        <div class="planet-card">
          <div class="rune ${RUNE_CLASS[name] || 'rune-sun'}">${RUNES[name] || '✦'}</div>
          <div class="info">
            <div class="name">${name}</div>
            <div class="sign">${data.sign} ${SIGN_GLYPHS[data.sign]}</div>
            <div class="degree">${Math.floor(data.degree)}°</div>
          </div>
        </div>
      `).join('');
  }

  // ─── INIT ──────────────────────────────────
  async function init() {
    // Generate stars
    generateStars();
    
    // Populate sign selector
    const sel = document.getElementById('birthSign');
    SIGNS.forEach(sign => {
      const o = document.createElement('option');
      o.value = sign;
      o.textContent = `${SIGN_GLYPHS[sign]} ${sign}`;
      sel.appendChild(o);
    });
    
    sel.onchange = (e) => {
      const sign = e.target.value;
      if (!sign) {
        document.getElementById('signMessage').innerHTML = '';
        return;
      }
      
      if (skyData?.planets) {
        const inSign = Object.entries(skyData.planets)
          .filter(([_, d]) => d && d.sign === sign)
          .map(([name]) => {
            const deity = CELESTIAL[name];
            return deity ? deity.olympian : name;
          });
        
        if (inSign.length > 0) {
          document.getElementById('signMessage').innerHTML = 
            `<strong>${inSign.join(', ')}</strong> walk${inSign.length === 1 ? 's' : ''} ${sign} ${SIGN_GLYPHS[sign]} today.<br><em>${Almanac.getWhisper(inSign[0], 50)}</em>`;
        } else {
          document.getElementById('signMessage').innerHTML = 
            `${SIGN_GLYPHS[sign]} ${sign} — The house is empty. No Olympian walks here.<br>This is not abandonment. This is <strong>privacy</strong>.`;
        }
      }
    };
    
    // Load
    await refresh();
  }

  async function refresh() {
    try {
      const sky = await Observe.getSkyState();
      skyData = sky;
      
      document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-US', {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
      });
      
      // Pick random voice
      const seed = Almanac.dailySeed();
      const voiceIndex = Almanac.seededInt(seed, VOICES.length);
      currentVoice = VOICES[voiceIndex];
      
      // Build display
      buildCenterDisplay(sky.period, sky.moonPhase);
      buildSkyDiagram(sky.planets);
      buildPlanetGrid(sky.planets);
      buildHouses(sky.planets);
      
      // Generate narrative with current voice
      const narrative = currentVoice.generate(sky.planets, sky.period, sky.moonPhase);
      document.getElementById('horoscopeText').innerHTML = narrative;
      document.getElementById('narrativeVoice').textContent = 
        `— Spoken by ${currentVoice.name} in the ${currentVoice.style} tradition`;
      
      // Reset sign message
      document.getElementById('signMessage').innerHTML = '';
      document.getElementById('birthSign').value = '';
      
    } catch (err) {
      console.error('Grimoire failed:', err);
      document.getElementById('horoscopeText').innerHTML = 
        'The sky is clouded. The stars cannot speak right now. Try again at dawn or dusk.';
    }
  }

  function generateStars() {
    const container = document.getElementById('stars');
    for (let i = 0; i < 200; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      const size = Math.random() * 2 + 1;
      star.style.width = size + 'px';
      star.style.height = size + 'px';
      star.style.animationDelay = Math.random() * 5 + 's';
      star.style.animationDuration = Math.random() * 3 + 2 + 's';
      container.appendChild(star);
    }
  }

  return { init, refresh };
})();

document.addEventListener('DOMContentLoaded', () => Grimoire.init());
</script>
